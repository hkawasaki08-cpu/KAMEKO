<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100dvh; /* Safari可変バー対応 */
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #18181b;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
      height: 38px;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #status-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: #8b5cf6; color: #fff; font-weight: bold;
    }

    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #09090b;
      overflow: hidden;
      min-height: 0;
    }
    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    #target-box {
      position: absolute;
      top: 36%; left: 4%; width: 92%; height: 105px;
      border: 2px solid #22c55e; border-radius: 4px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
      z-index: 10; pointer-events: none;
      display: flex; justify-content: space-between; padding: 4px;
    }
    .box-tag {
      font-size: 10px; color: #22c55e;
      background: rgba(0,0,0,0.65); padding: 2px 5px; border-radius: 2px;
    }

    #dash {
      position: absolute; top: 6px; left: 6px; right: 6px;
      z-index: 20; display: flex; gap: 6px;
    }
    .card {
      flex: 1; background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
      padding: 4px 2px; text-align: center;
    }
    .card-lbl { font-size: 9px; color: #aaa; }
    .card-val { font-size: 19px; font-weight: bold; font-variant-numeric: tabular-nums; }
    .card-unit { font-size: 10px; color: #888; }

    #mode-bar {
      position: absolute; top: 62px; left: 6px; right: 6px;
      display: flex; gap: 6px; z-index: 20;
    }
    .mode-tab {
      flex: 1; background: rgba(15, 23, 42, 0.9);
      border: 1px solid #475569; color: #94a3b8;
      padding: 4px 0; border-radius: 5px; font-size: 10px;
      cursor: pointer; text-align: center;
    }
    .mode-tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: bold; }

    /* 動画コントローラー */
    #v-bar {
      position: absolute; bottom: 6px; left: 6px; right: 6px;
      background: rgba(15, 23, 42, 0.95); border: 1px solid #38bdf8;
      border-radius: 6px; padding: 5px; z-index: 25;
      display: none; flex-direction: column; gap: 3px;
    }
    .v-row { display: flex; gap: 4px; align-items: center; }
    .v-btn {
      flex: 1; background: #1e293b; color: #fff;
      border: 1px solid #475569; padding: 5px 0; border-radius: 4px;
      font-size: 10px; text-align: center; cursor: pointer;
    }
    .speed-btn {
      flex: 1; background: #0f172a; color: #94a3b8;
      border: 1px solid #334155; padding: 2px 0; border-radius: 4px;
      font-size: 9px; font-weight: bold; text-align: center; cursor: pointer;
    }
    .speed-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    /* 操作ボタン（画面下に絶対固定） */
    footer {
      background: #18181b;
      padding: 6px 8px calc(14px + env(safe-area-inset-bottom, 12px));
      display: flex; flex-direction: column; gap: 5px;
      border-top: 1px solid #333; flex-shrink: 0; z-index: 40;
    }
    .btn-row { display: flex; gap: 5px; }
    button, label.btn {
      flex: 1; background: #27272a; color: #fff;
      border: 1px solid #3f3f46; padding: 9px 0; border-radius: 6px;
      font-size: 11px; font-weight: 500; text-align: center;
      cursor: pointer; touch-action: manipulation;
      display: flex; justify-content: center; align-items: center;
    }
    button.green { background: #16a34a; border-color: #15803d; font-weight: bold; }
    button.orange { background: #d97706; border-color: #b45309; }
    button.purple { background: #7c3aed; border-color: #6d28d9; font-weight: bold; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">(仮称)カメラ式ケーブル距離計 - KAMEKO</div>
    <div id="status-badge">手動測定中</div>
  </header>

  <div id="stage">
    <video id="v" playsinline webkit-playsinline muted autoplay loop></video>
    <canvas id="c-proc" style="display:none;"></canvas>

    <div id="target-box">
      <span class="box-tag">🎯 測定枠</span>
      <span class="box-tag" style="color:#facc15;">手動モード (テープ不要)</span>
    </div>

    <div id="dash">
      <div class="card">
        <div class="card-lbl">延線距離</div>
        <div><span id="txt-dist" class="card-val">0.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card" style="border-color: #38bdf8;">
        <div class="card-lbl">目標残 (目標: <span id="txt-target-val">31</span>m)</div>
        <div><span id="txt-remain" class="card-val" style="color: #38bdf8;">31.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card">
        <div class="card-lbl">速度 (平均)</div>
        <div><span id="txt-speed" class="card-val">0.0</span><span class="card-unit">m/分</span></div>
      </div>
    </div>

    <div id="mode-bar">
      <button class="mode-tab active" id="tab-manual">✋ 手動運用モード (テープ無)</button>
      <button class="mode-tab" id="tab-auto">🎯 自動テープ検知モード</button>
    </div>

    <div id="v-bar">
      <div class="v-row">
        <span style="font-size: 9px; color: #38bdf8; min-width: 40px; font-weight: bold;">速度:</span>
        <button class="speed-btn" data-speed="0.25">0.25x</button>
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn active" data-speed="1.0">1.0x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="2.0">2.0x</button>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:9px; color:#94a3b8;">
        <span>🎬 動画コントローラー</span>
        <span id="v-time">0.0s</span>
      </div>
      <div class="v-row">
        <button class="v-btn" id="vb-b1">-1秒</button>
        <button class="v-btn" id="vb-bstep">◀ コマ戻</button>
        <button class="v-btn" id="vb-play" style="background:#0284c7;">一時停止 ⏸</button>
        <button class="v-btn" id="vb-fstep">コマ送 ▶</button>
        <button class="v-btn" id="vb-f1">+1秒</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="btn-row">
      <button id="b-manual-start" class="purple">▶ 手動スタート (0m)</button>
      <button id="b-set-target">目標mセット</button>
      <button id="b-zero" style="color:#f87171;">0mリセット</button>
    </div>
    <div class="btn-row">
      <button id="b-pause" class="orange">一時停止 ⏸</button>
      <button id="b-cam" class="green">カメラ起動</button>
      <label class="btn" for="f-video" style="background:#2563eb; font-weight:bold;">動画読込</label>
      <input type="file" id="f-video" accept="video/*">
    </div>
  </footer>

  <script>
    var scaleFactor = 1.4;
    var totalDist = 0.0;
    var targetDist = 31.0;
    var isRunning = false;
    var isPaused = false;
    var isManualTracking = true;
    var currentPlaybackRate = 1.0;

    var speedSamples = [];
    var lastSpeedTime = performance.now();
    var currentSpeed = 0.0;
    var lastLoopTime = performance.now();
    var prevProfile = null;

    var stage = document.getElementById('stage');
    var targetBox = document.getElementById('target-box');
    var v = document.getElementById('v');
    var cProc = document.getElementById('c-proc');
    var ctxProc = cProc.getContext('2d', { willReadFrequently: true });

    var txtDist = document.getElementById('txt-dist');
    var txtRemain = document.getElementById('txt-remain');
    var txtTargetVal = document.getElementById('txt-target-val');
    var txtSpeed = document.getElementById('txt-speed');
    var vBar = document.getElementById('v-bar');
    var vTime = document.getElementById('v-time');
    var bPause = document.getElementById('b-pause');
    var bManualStart = document.getElementById('b-manual-start');
    var vbPlay = document.getElementById('vb-play');

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.15;
      window.speechSynthesis.speak(uttr);
    }

    bManualStart.addEventListener('click', function() {
      totalDist = 0.0;
      isManualTracking = true;
      isPaused = false;
      bPause.className = 'orange';
      bPause.innerText = '一時停止 ⏸';
      prevProfile = null;
      updateDistUI();
      if (v.paused) { v.play(); vbPlay.innerText = '一時停止 ⏸'; }
      speak('測定を開始します');
    });

    document.getElementById('b-zero').addEventListener('click', function() {
      totalDist = 0.0;
      speedSamples = [];
      updateDistUI();
      txtSpeed.innerText = "0.0";
      speak('リセットしました');
    });

    document.getElementById('b-set-target').addEventListener('click', function() {
      var val = window.prompt("目標距離(m)を入力:", targetDist);
      if (val !== null && !isNaN(parseFloat(val))) {
        targetDist = Math.max(1, parseFloat(val));
        txtTargetVal.innerText = targetDist;
        updateDistUI();
      }
    });

    function updateDistUI() {
      txtDist.innerText = totalDist.toFixed(2);
      var rem = targetDist - totalDist;
      txtRemain.innerText = rem.toFixed(2);
      txtRemain.style.color = (rem <= 0) ? '#ef4444' : '#38bdf8';
    }

    var spdBtns = document.querySelectorAll('.speed-btn');
    for (var i = 0; i < spdBtns.length; i++) {
      spdBtns[i].addEventListener('click', function() {
        for (var j = 0; j < spdBtns.length; j++) { spdBtns[j].classList.remove('active'); }
        this.classList.add('active');
        currentPlaybackRate = parseFloat(this.getAttribute('data-speed'));
        v.playbackRate = currentPlaybackRate;
      });
    }

    document.getElementById('b-cam').addEventListener('click', function() {
      vBar.style.display = 'none';
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
        }).then(function(stream) {
          v.srcObject = stream; v.playbackRate = 1.0; v.play();
          isPaused = false; bPause.innerText = '一時停止 ⏸';
          startLoop();
        }).catch(function(e) { alert("カメラエラー: " + e.message); });
      }
    });

    document.getElementById('f-video').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      if (v.srcObject) { v.srcObject.getTracks().forEach(function(t) { t.stop(); }); v.srcObject = null; }
      v.src = URL.createObjectURL(file);
      vBar.style.display = 'flex';
      v.playbackRate = currentPlaybackRate;
      v.play();
      vbPlay.innerText = '一時停止 ⏸';
      isPaused = false;
      bPause.className = 'orange';
      bPause.innerText = '一時停止 ⏸';
      isManualTracking = true;
      startLoop();
    });

    vbPlay.addEventListener('click', function() {
      if (v.paused) { v.play(); vbPlay.innerText = '一時停止 ⏸'; }
      else { v.pause(); vbPlay.innerText = '再生 ▶'; }
    });
    document.getElementById('vb-b1').addEventListener('click', function() { v.currentTime = Math.max(0, v.currentTime - 1); });
    document.getElementById('vb-f1').addEventListener('click', function() { v.currentTime = Math.min(v.duration || 999, v.currentTime + 1); });
    document.getElementById('vb-bstep').addEventListener('click', function() { v.pause(); vbPlay.innerText = '再生 ▶'; v.currentTime = Math.max(0, v.currentTime - 0.033); });
    document.getElementById('vb-fstep').addEventListener('click', function() { v.pause(); vbPlay.innerText = '再生 ▶'; v.currentTime = Math.min(v.duration || 999, v.currentTime + 0.033); });
    v.addEventListener('timeupdate', function() {
      if (v.duration) vTime.innerText = v.currentTime.toFixed(1) + 's / ' + v.duration.toFixed(1) + 's';
    });

    bPause.addEventListener('click', function() {
      isPaused = !isPaused;
      if (isPaused) { bPause.className = 'green'; bPause.innerText = '測定再開 ▶'; txtSpeed.innerText = "0.0"; }
      else { bPause.className = 'orange'; bPause.innerText = '一時停止 ⏸'; prevProfile = null; }
    });

    function startLoop() {
      if (isRunning) return;
      isRunning = true;
      requestAnimationFrame(mainLoop);
    }

    function mainLoop(now) {
      if (v.readyState >= 2 && v.videoWidth > 0) {
        var pw = 160; var ph = 32;
        if (cProc.width !== pw || cProc.height !== ph) { cProc.width = pw; cProc.height = ph; }

        var vw = v.videoWidth;
        var vh = v.videoHeight;
        var sRect = stage.getBoundingClientRect();
        var bRect = targetBox.getBoundingClientRect();

        var scale = Math.max(sRect.width / vw, sRect.height / vh);
        var rw = vw * scale;
        var rh = vh * scale;
        var ox = (sRect.width - rw) / 2;
        var oy = (sRect.height - rh) / 2;

        var sx = Math.max(0, Math.floor((bRect.left - sRect.left - ox) / scale));
        var sy = Math.max(0, Math.floor((bRect.top - sRect.top - oy) / scale));
        var swSrc = Math.min(vw - sx, Math.floor(bRect.width / scale));
        var shSrc = Math.min(vh - sy, Math.floor(bRect.height / scale));

        ctxProc.drawImage(v, sx, sy, swSrc, shSrc, 0, 0, pw, ph);
        var imgData = ctxProc.getImageData(0, 0, pw, ph).data;

        var curProf = new Float32Array(pw);
        for (var x = 0; x < pw; x++) {
          var sumG = 0;
          for (var y = 0; y < ph; y++) {
            var idx = (y * pw + x) * 4;
            sumG += 0.299 * imgData[idx] + 0.587 * imgData[idx+1] + 0.114 * imgData[idx+2];
          }
          curProf[x] = sumG / ph;
        }

        if (!isPaused && prevProfile) {
          var maxS = 16, bestS = 0, minDiff = 9999999;
          for (var s = -maxS; s <= maxS; s++) {
            var diff = 0;
            for (var i = maxS; i < pw - maxS; i++) {
              diff += Math.abs(prevProfile[i] - curProf[i + s]);
            }
            if (diff < minDiff) { minDiff = diff; bestS = s; }
          }

          var shiftPx = bestS * (swSrc / pw);
          var dt = (now - lastLoopTime) / 1000.0;

          if (isManualTracking && Math.abs(shiftPx) > 0.005) {
            var deltaM = (shiftPx / scaleFactor) / 1000.0;
            totalDist += deltaM;
            updateDistUI();

            if (dt > 0 && dt < 0.25) {
              var instSpeed = (deltaM / dt) * 60.0;
              speedSamples.push(Math.max(0, instSpeed));
            }
          }

          if (now - lastSpeedTime > 500) {
            if (speedSamples.length > 0) {
              var avg = speedSamples.reduce(function(a, b) { return a + b; }, 0) / speedSamples.length;
              currentSpeed = currentSpeed * 0.3 + avg * 0.7;
              speedSamples = [];
            } else {
              currentSpeed = 0.0;
            }
            txtSpeed.innerText = Math.max(0, currentSpeed).toFixed(1);
            lastSpeedTime = now;
          }
        }
        prevProfile = curProf;
      }

      lastLoopTime = now;
      requestAnimationFrame(mainLoop);
    }
  </script>
</body>
</html>
