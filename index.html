    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #fps { font-size: 11px; color: #aaa; }

    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 測定枠（CSSで確実に常時表示） */
    #cable-target-box {
      position: absolute;
      top: 60%;
      left: 4%;
      width: 92%;
      height: 90px;
      border: 2px solid #22c55e;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
      z-index: 15;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      padding: 4px;
    }
    .box-label {
      font-size: 10px;
      color: #22c55e;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 2px;
    }

    /* ダッシュボード */
    #dash {
      position: absolute;
      top: 8px;
      left: 6px;
      right: 6px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .card {
      flex: 1;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
    }
    .card-lbl { font-size: 9px; color: #aaa; }
    .card-val { font-size: 20px; font-weight: bold; }
    .card-unit { font-size: 10px; color: #888; margin-left: 1px; }

    /* モード切替 */
    #scale-selector {
      position: absolute;
      top: 68px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }

    /* 動画コントローラー */
    #v-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 8px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .v-row { display: flex; gap: 4px; align-items: center; }
    .v-btn {

      color: #fff;
      border: 1px solid #475569;
      padding: 5px 0;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
    }
