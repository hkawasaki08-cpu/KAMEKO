<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>カメラ式ケーブル延線距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100dvh;
      background: #09090b; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }
    header {
      background: #18181b; padding: 6px 12px; height: 38px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #27272a; flex-shrink: 0; z-index: 30;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #status-badge {
      font-size: 11px; padding: 3px 8px; border-radius: 4px;
      background: #475569; color: #fff; font-weight: bold;
    }
    #status-badge.active { background: #16a34a; }
    #status-badge.cal1 { background: #d97706; }
    #status-badge.cal2 { background: #0284c7; }

    #dash-container {
      background: #111827; padding: 8px 8px 6px;
      border-bottom: 1px solid #1f2937; flex-shrink: 0; z-index: 25;
    }
    #dash { display: flex; gap: 6px; }
    .card {
      flex: 1; background: #000; border: 1.5px solid #374151;
      border-radius: 8px; padding: 6px 2px 4px; text-align: center;
    }
    .card-lbl { font-size: 11px; color: #9ca3af; font-weight: bold; }
    .card-val { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .card-unit { font-size: 12px; color: #9ca3af; margin-left: 2px; }
    .card-sub { font-size: 11px; color: #38bdf8; font-weight: bold; margin-top: 3px; }

    #control-subbar {
      background: #18181b; padding: 5px 8px; display: flex;
      gap: 6px; align-items: stretch; border-bottom: 1px solid #27272a; flex-shrink: 0;
    }
    .mode-tab {
      flex: 1; background: #1e293b; border: 1px solid #475569; color: #94a3b8;
      padding: 7px 0; border-radius: 6px; font-size: 12px; font-weight: bold;
      cursor: pointer; text-align: center;
    }
    .mode-tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    #btn-dir {
      flex: 0 0 74px; font-size: 22px; font-weight: 900; line-height: 1;
      border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #btn-dir.dir-fwd { background: #0d9488; border: 1.5px solid #2dd4bf; color: #fff; }
    #btn-dir.dir-rev { background: #ea580c; border: 1.5px solid #fb923c; color: #fff; }

    #stage {
      position: relative; height: 175px; width: 100%;
      background: #000; overflow: hidden; flex-shrink: 0; border-bottom: 1px solid #334155;
    }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    #target-box {
      position: absolute; top: 20%; left: 4%; width: 92%; height: 60%;
      border: 2px solid #22c55e; border-radius: 6px;
      box-shadow: inset 0 0 8px rgba(34, 197, 94, 0.4); z-index: 10; pointer-events: none;
    }
    #error-banner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(220, 38, 38, 0.95); border: 2px solid #fca5a5;
      color: #fff; padding: 6px 18px; border-radius: 20px; font-size: 13px;
      font-weight: bold; z-index: 35; display: none; white-space: nowrap;
    }

    #diag-panel {
      background: #0b1329; border-bottom: 1px solid #1e293b;
      padding: 5px 8px; display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    }
    #diag-info { flex: 1; display: flex; flex-direction: column; gap: 1px; }
    #diag-msg { font-size: 11px; font-weight: bold; color: #4ade80; }
    #diag-sub { font-size: 9px; color: #94a3b8; font-variant-numeric: tabular-nums; }
    #diag-canvas {
      width: 100px; height: 22px; border: 1px solid #334155;
      border-radius: 3px; background: #000; display: block;
    }

    footer {
      background: #18181b; padding: 8px 8px calc(14px + env(safe-area-inset-bottom, 12px));
      display: flex; flex-direction: column; gap: 7px; border-top: 1px solid #27272a;
      flex: 1; justify-content: flex-end; z-index: 40;
    }
    .btn-row { display: flex; gap: 7px; flex: 1; max-height: 52px; }
    button, label.btn {
      flex: 1; background: #27272a; color: #fff; border: 1.5px solid #3f3f46;
      border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center;
      cursor: pointer; touch-action: manipulation; display: flex; justify-content: center;
      align-items: center; min-height: 44px;
    }
    button.green { background: #16a34a; border-color: #22c55e; }
    button.orange { background: #d97706; border-color: #f59e0b; }
    button.purple { background: #7c3aed; border-color: #a855f7; }
    button.mic-on { background: #dc2626 !important; border-color: #ef4444 !important; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">KAMEKO ケーブル距離計</div>
    <div id="status-badge">手動待機中</div>
  </header>

  <div id="dash-container">
    <div id="dash">
      <div class="card">
        <div class="card-lbl">延線距離</div>
        <div><span id="txt-dist" class="card-val">0.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card" style="border-color: #0284c7;">
        <div class="card-lbl">残距離 (目標: <span id="txt-target-val">30</span>m)</div>
        <div><span id="txt-remain" class="card-val" style="color: #38bdf8;">30.00</span><span class="card-unit">m</span></div>
        <div class="card-sub" id="txt-eta">予想: --分--秒</div>
      </div>
      <div class="card">
        <div class="card-lbl">速度</div>
        <div><span id="txt-speed" class="card-val">0.0</span><span class="card-unit">m/分</span></div>
      </div>
    </div>
  </div>

  <div id="control-subbar">
    <button class="dir-fwd" id="btn-dir" title="タップで方向切替">➡</button>
    <button class="mode-tab active" id="tab-auto">🎯 自動校正モード</button>
    <button class="mode-tab" id="tab-manual">✋ 手動モード</button>
  </div>

  <div id="stage">
    <video id="v" playsinline webkit-playsinline muted loop></video>
    <canvas id="c-proc" style="display:none;"></canvas>
    <div id="target-box"></div>
    <div id="error-banner">⚠️ 逆送り検知</div>
  </div>

  <div id="diag-panel">
    <div id="diag-info">
      <span id="diag-msg">🔍 カメラ待機中...</span>
      <span id="diag-sub">環境光・エッジ診断</span>
    </div>
    <canvas id="diag-canvas" width="160" height="32"></canvas>
  </div>

  <footer>
    <div class="btn-row">
      <button id="b-manual-start" class="purple" style="display:none;">▶ 手動スタート (0m)</button>
      <button id="b-pause" class="orange">一時停止 ⏸</button>
      <button id="b-mic" style="background:#2563eb;">🎤 音声操作 ON</button>
    </div>
    <div class="btn-row">
      <button id="b-cam" class="green">カメラ起動</button>
      <label class="btn" for="f-video" style="background:#1e293b; border-color:#475569;">動画検証</label>
      <input type="file" id="f-video" accept="video/*">
      <button id="b-set-target" style="background:#334155;">目標m</button>
      <button id="b-zero" style="background:#334155; color:#f87171;">リセット</button>
    </div>
  </footer>

  <script>
    var operationMode = 'AUTO';
    var scaleFactor = 2.5; // 初期スケール: 2.5 px/mm (約40cm〜1m想定)
    var moveDirection = 1;
    var totalDist = 0.0;
    var targetDist = 30.0;
    var isRunning = false;
    var isPaused = false;
    var isManualTracking = false;

    // 自動校正状態
    var autoState = 'WAIT_HEAD_INSIDE';
    var isInsideYellow = false;
    var totalPxSinceStart = 0.0;
    var whiteFrameCount = 0;

    var announcedMarks = {};
    var speedSamples = [];
    var lastSpeedTime = performance.now();
    var currentSpeed = 0.0;
    var lastProcessTime = 0;
    var lastDiagTime = 0;
    var backwardStreak = 0;

    var PW = 200, PH = 32;
    var rawProf = new Float32Array(PW);
    var curProf = new Float32Array(PW);
    var prevProf = new Float32Array(PW);
    var hasPrevProf = false;

    var stage = document.getElementById('stage');
    var targetBox = document.getElementById('target-box');
    var v = document.getElementById('v');
    var cProc = document.getElementById('c-proc');
    cProc.width = PW; cProc.height = PH;
    var ctxProc = cProc.getContext('2d', { willReadFrequently: true });

    var diagMsg = document.getElementById('diag-msg');
    var diagSub = document.getElementById('diag-sub');
    var diagCanvas = document.getElementById('diag-canvas');
    var ctxDiag = diagCanvas.getContext('2d');
    var diagImgData = ctxDiag.createImageData(160, 32);

    var txtDist = document.getElementById('txt-dist');
    var txtRemain = document.getElementById('txt-remain');
    var txtTargetVal = document.getElementById('txt-target-val');
    var txtSpeed = document.getElementById('txt-speed');
    var txtEta = document.getElementById('txt-eta');
    var bPause = document.getElementById('b-pause');
    var statusBadge = document.getElementById('status-badge');
    var errorBanner = document.getElementById('error-banner');
    var bManualStart = document.getElementById('b-manual-start');
    var btnDir = document.getElementById('btn-dir');
    var bMic = document.getElementById('b-mic');

    btnDir.addEventListener('click', function() {
      if (moveDirection === 1) {
        moveDirection = -1;
        btnDir.innerText = '⬅';
        btnDir.className = 'dir-rev';
        speak('左送り設定', 1);
      } else {
        moveDirection = 1;
        btnDir.innerText = '➡';
        btnDir.className = 'dir-fwd';
        speak('右送り設定', 1);
      }
      backwardStreak = 0;
      errorBanner.style.display = 'none';
      hasPrevProf = false;
    });

    function speak(text, repeat) {
      if (!('speechSynthesis' in window)) return;
      var count = repeat || 1;
      for (var i = 0; i < count; i++) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.rate = 1.15;
        window.speechSynthesis.speak(u);
      }
    }

    function checkDistanceAnnouncements(d) {
      var diff = targetDist - d;
      // 5m毎アナウンス
      if (diff > 10.5) {
        var step5 = Math.floor(d / 5.0) * 5;
        if (step5 >= 5 && (d - step5) < 0.6 && !announcedMarks['fwd_' + step5]) {
          announcedMarks['fwd_' + step5] = true;
          speak(step5 + 'メートル', 1);
          return;
        }
      }
      // ラスト10m〜1mの秒読み
      for (var m = 10; m >= 1; m--) {
        if (diff <= m && !announcedMarks['rem_' + m]) {
          announcedMarks['rem_' + m] = true;
          speak(m + 'メートル', 1);
          return;
        }
      }
      // 目標到達
      if (diff <= 0.05 && diff >= -0.3 && !announcedMarks['zero']) {
        announcedMarks['zero'] = true;
        speak('ゼロ、到達しました', 1);
        return;
      }
      // 超過案内
      if (diff < 0) {
        var overM = Math.floor(Math.abs(diff));
        if (overM >= 1 && overM <= 15 && !announcedMarks['over_' + overM]) {
          announcedMarks['over_' + overM] = true;
          speak('プラス ' + overM + 'メートル', 1);
        }
      }
    }

    // 音声操作 (Web Speech API)
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = null;
    var isMicListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.onresult = function(e) {
        for (var i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            var cmd = e.results[i][0].transcript.trim().replace(/\s+/g, '');
            if (cmd.includes('スタート') || cmd.includes('開始')) {
              startManualMeasurement();
            } else if (cmd.includes('ストップ') || cmd.includes('停止')) {
              setPauseState(true);
              speak('停止しました', 1);
            } else if (cmd.includes('リセット')) {
              resetAll();
              speak('リセットしました', 1);
            }
          }
        }
      };
      recognition.onend = function() {
        if (isMicListening) { try { recognition.start(); } catch(err) {} }
      };
    }

    bMic.addEventListener('click', function() {
      if (!SpeechRecognition) {
        alert('ブラウザが音声認識に対応していません');
        return;
      }
      isMicListening = !isMicListening;
      if (isMicListening) {
        try { recognition.start(); } catch(e) {}
        bMic.classList.add('mic-on');
        bMic.innerText = '🎤 音声認識中';
        speak('音声操作を開始します', 1);
      } else {
        recognition.stop();
        bMic.classList.remove('mic-on');
        bMic.innerText = '🎤 音声操作 ON';
        speak('音声操作を終了しました', 1);
      }
    });

    // モード切替
    var tabAuto = document.getElementById('tab-auto');
    var tabManual = document.getElementById('tab-manual');

    tabAuto.addEventListener('click', function() {
      operationMode = 'AUTO';
      tabAuto.className = 'mode-tab active';
      tabManual.className = 'mode-tab';
      bManualStart.style.display = 'none';
      resetAll();
      speak('自動校正モード', 1);
    });

    tabManual.addEventListener('click', function() {
      operationMode = 'MANUAL';
      tabManual.className = 'mode-tab active';
      tabAuto.className = 'mode-tab';
      bManualStart.style.display = 'flex';
      resetAll();
      speak('手動モード', 1);
    });

    bManualStart.addEventListener('click', startManualMeasurement);

    function startManualMeasurement() {
      totalDist = 0.0;
      totalPxSinceStart = 0.0;
      isManualTracking = true;
      setPauseState(false);
      hasPrevProf = false;
      announcedMarks = {};
      backwardStreak = 0;
      updateDistUI();
      statusBadge.className = 'active';
      statusBadge.innerText = '手動測定中';
      if (v.paused) v.play().catch(function(){});
      speak('測定を開始します。', 2);
    }

    function setPauseState(paused) {
      isPaused = paused;
      if (isPaused) {
        bPause.className = 'green';
        bPause.innerText = '再開 ▶';
        txtSpeed.innerText = "0.0";
        txtEta.innerText = "予想: --分--秒";
        backwardStreak = 0;
        errorBanner.style.display = 'none';
        if (!v.paused) v.pause();
      } else {
        bPause.className = 'orange';
        bPause.innerText = '一時停止 ⏸';
        hasPrevProf = false;
        backwardStreak = 0;
        if (v.paused) v.play().catch(function(){});
      }
    }

    function resetAll() {
      totalDist = 0.0;
      totalPxSinceStart = 0.0;
      isInsideYellow = false;
      isManualTracking = false;
      whiteFrameCount = 0;
      hasPrevProf = false;
      announcedMarks = {};
      speedSamples = [];
      backwardStreak = 0;
      errorBanner.style.display = 'none';
      updateDistUI();
      txtSpeed.innerText = "0.0";
      txtEta.innerText = "予想: --分--秒";

      if (operationMode === 'AUTO') {
        autoState = 'WAIT_HEAD_INSIDE';
        statusBadge.className = '';
        statusBadge.innerText = '待機中 (ヘッド通過待ち)';
      } else {
        statusBadge.className = '';
        statusBadge.innerText = '手動待機中';
      }
    }

    document.getElementById('b-zero').addEventListener('click', function() {
      resetAll();
      speak('リセットしました', 1);
    });

    document.getElementById('b-set-target').addEventListener('click', function() {
      var val = window.prompt("目標距離 (m):", targetDist);
      if (val !== null && !isNaN(parseFloat(val))) {
        targetDist = Math.max(1, parseFloat(val));
        txtTargetVal.innerText = targetDist;
        announcedMarks = {};
        updateDistUI();
        speak(targetDist + 'メートルに設定', 1);
      }
    });

    function updateDistUI() {
      txtDist.innerText = totalDist.toFixed(2);
      var rem = targetDist - totalDist;
      if (rem < 0) {
        txtRemain.innerText = '+' + Math.abs(rem).toFixed(2);
        txtRemain.style.color = '#ef4444';
        txtEta.innerText = "予想: 到達済";
      } else {
        txtRemain.innerText = rem.toFixed(2);
        txtRemain.style.color = '#38bdf8';
        if (currentSpeed >= 0.5) {
          var sec = Math.round((rem / currentSpeed) * 60.0);
          txtEta.innerText = "予想: " + Math.floor(sec / 60) + "分" + (sec % 60 < 10 ? "0" : "") + (sec % 60) + "秒";
        } else {
          txtEta.innerText = "予想: --分--秒";
        }
      }
    }

    // カメラ / 動画ソース
    function openCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('ブラウザがカメラ機能に対応していません');
        return;
      }
      navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
      }).then(function(stream) {
        v.srcObject = stream;
        v.play();
        setPauseState(false);
        resetAll();
        startLoop();
      }).catch(function(e) {
        alert('カメラ起動エラー: ' + e.message);
      });
    }

    document.getElementById('b-cam').addEventListener('click', openCamera);

    document.getElementById('f-video').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      if (v.srcObject) { v.srcObject.getTracks().forEach(function(t){ t.stop(); }); v.srcObject = null; }
      v.src = URL.createObjectURL(file);
      v.currentTime = 0;
      v.play();
      setPauseState(false);
      resetAll();
      startLoop();
    });

    bPause.addEventListener('click', function() {
      setPauseState(!isPaused);
    });

    function startLoop() {
      if (isRunning) return;
      isRunning = true;
      requestAnimationFrame(mainLoop);
    }

    function runDiagnostics(avgLum, glareRatio, avgEdge, whiteRatioPct, yellowRatioPct, now) {
      if (now - lastDiagTime < 300) return;
      lastDiagTime = now;

      if (avgLum < 35) {
        diagMsg.innerText = "❌ 光量不足 (暗すぎます)";
        diagMsg.style.color = "#ef4444";
      } else if (avgLum > 225) {
        diagMsg.innerText = "❌ 光量過多 (白飛び)";
        diagMsg.style.color = "#ef4444";
      } else if (glareRatio > 0.12) {
        diagMsg.innerText = "⚠️ 照り返し過多 (反射)";
        diagMsg.style.color = "#facc15";
      } else if (avgEdge < 1.6) {
        diagMsg.innerText = "⚠️ コントラスト不足";
        diagMsg.style.color = "#facc15";
      } else {
        diagMsg.innerText = "🟢 測定環境: 良好";
        diagMsg.style.color = "#4ade80";
      }
      diagSub.innerText = "白: " + whiteRatioPct.toFixed(1) + "% | 黄: " + yellowRatioPct.toFixed(1) + "% | エッジ: " + avgEdge.toFixed(1);

      // エッジプロファイル描画
      var d = diagImgData.data;
      for (var dx = 0; dx < 160; dx++) {
        var srcX = Math.floor(dx * (PW / 160));
        var val = Math.min(255, Math.floor(Math.abs(curProf[srcX]) * 18));
        for (var dy = 0; dy < 32; dy++) {
          var idx = (dy * 160 + dx) * 4;
          d[idx] = val; d[idx+1] = val; d[idx+2] = val; d[idx+3] = 255;
        }
      }
      ctxDiag.putImageData(diagImgData, 0, 0);
    }

    function mainLoop(now) {
      if (now - lastProcessTime > 30) {
        var dt = (now - lastProcessTime) / 1000.0;
        lastProcessTime = now;

        if (v.readyState >= 2 && v.videoWidth > 0 && !v.paused) {
          var vw = v.videoWidth, vh = v.videoHeight;
          var sRect = stage.getBoundingClientRect();
          var bRect = targetBox.getBoundingClientRect();

          var scale = Math.max(sRect.width / vw, sRect.height / vh);
          var ox = (sRect.width - vw * scale) / 2;
          var oy = (sRect.height - vh * scale) / 2;

          var sx = Math.max(0, Math.floor((bRect.left - sRect.left - ox) / scale));
          var sy = Math.max(0, Math.floor((bRect.top - sRect.top - oy) / scale));
          var swSrc = Math.min(vw - sx, Math.floor(bRect.width / scale));
          var shSrc = Math.min(vh - sy, Math.floor(bRect.height / scale));

          ctxProc.drawImage(v, sx, sy, swSrc, shSrc, 0, 0, PW, PH);
          var img = ctxProc.getImageData(0, 0, PW, PH).data;

          var whiteCount = 0, yellowCount = 0, glareCount = 0, sumLum = 0;

          // 輝度プロファイルとテープ色判定
          for (var x = 0; x < PW; x++) {
            var colLum = 0;
            for (var y = 0; y < PH; y++) {
              var idx = (y * PW + x) * 4;
              var r = img[idx], g = img[idx+1], b = img[idx+2];
              if (r > 165 && g > 165 && b > 155 && Math.abs(r - g) < 25) whiteCount++;
              if (r > 240 && g > 240 && b > 240) glareCount++;
              if (r > 150 && g > 140 && b < 115 && (r + g - 2 * b) > 90) yellowCount++;

              var lum = 0.299 * r + 0.587 * g + 0.114 * b;
              colLum += lum; sumLum += lum;
            }
            rawProf[x] = colLum / PH;
          }

          // 1次元微分エッジプロファイル生成
          for (var x = 0; x < PW; x++) {
            if (x === 0) curProf[x] = rawProf[1] - rawProf[0];
            else if (x === PW - 1) curProf[x] = rawProf[PW - 1] - rawProf[PW - 2];
            else curProf[x] = (rawProf[x + 1] - rawProf[x - 1]) * 0.5;
          }

          var totalPixels = PW * PH;
          var whiteRatio = whiteCount / totalPixels;
          var yellowRatio = yellowCount / totalPixels;

          var sumEdge = 0;
          for (var x = 0; x < PW; x++) sumEdge += Math.abs(curProf[x]);
          runDiagnostics(sumLum / totalPixels, glareCount / totalPixels, sumEdge / PW, whiteRatio * 100, yellowRatio * 100, now);

          // 自動校正シーケンス
          if (operationMode === 'AUTO') {
            var isWhite = whiteRatio > 0.10;
            var isYellow = yellowRatio > 0.08;

            if (autoState === 'WAIT_HEAD_INSIDE') {
              if (isWhite) {
                whiteFrameCount++;
                if (whiteFrameCount >= 2) {
                  autoState = 'WAIT_HEAD_TRAILING';
                  statusBadge.innerText = 'ヘッド進入検知';
                }
              } else { whiteFrameCount = 0; }
            } else if (autoState === 'WAIT_HEAD_TRAILING') {
              if (whiteRatio < 0.05) {
                autoState = 'TRACKING_WAIT_YEL1';
                totalDist = 0.0; totalPxSinceStart = 0.0;
                statusBadge.className = 'active';
                statusBadge.innerText = '測定中 (1m黄待ち)';
                updateDistUI();
                speak('測定を開始します。測定を開始します', 1);
              }
            } else if (autoState === 'TRACKING_WAIT_YEL1') {
              if (isYellow) {
                isInsideYellow = true;
              } else if (isInsideYellow && !isYellow && totalPxSinceStart > 500) {
                isInsideYellow = false;
                autoState = 'TRACKING_WAIT_YEL2';
                scaleFactor = totalPxSinceStart / 1000.0;
                totalDist = 1.0;
                statusBadge.className = 'cal1';
                statusBadge.innerText = '1次校正済 (1.00m)';
                speak('1メートル通過、1次校正完了', 1);
              }
            } else if (autoState === 'TRACKING_WAIT_YEL2') {
              if (isYellow) {
                isInsideYellow = true;
              } else if (isInsideYellow && !isYellow && totalPxSinceStart > (scaleFactor * 1600)) {
                isInsideYellow = false;
                autoState = 'TRACKING_FINAL';
                scaleFactor = totalPxSinceStart / 2000.0;
                totalDist = 2.0;
                statusBadge.className = 'cal2';
                statusBadge.innerText = '本校正完了 (2.00m)';
                speak('2メートル通過、本校正完了しました', 1);
              }
            }
          }

          var canTrack = (operationMode === 'MANUAL' && isManualTracking) ||
                         (operationMode === 'AUTO' && autoState !== 'WAIT_HEAD_INSIDE' && autoState !== 'WAIT_HEAD_TRAILING');

          // 相関マッチングによる移動量推定
          if (canTrack && hasPrevProf) {
            var maxS = 40, bestS = 0, minDiff = 99999999;
            for (var s = -maxS; s <= maxS; s++) {
              var diff = 0;
              for (var i = maxS; i < PW - maxS; i++) {
                diff += Math.abs(prevProf[i] - curProf[i + s]);
              }
              if (diff < minDiff) { minDiff = diff; bestS = s; }
            }

            var shiftPx = (bestS * moveDirection) * (swSrc / PW);

            // 逆送り検出
            if (shiftPx < -1.5) {
              backwardStreak++;
              if (backwardStreak >= 3) {
                errorBanner.style.display = 'block';
              }
            } else {
              backwardStreak = 0;
              errorBanner.style.display = 'none';
            }

            if (Math.abs(shiftPx) > 0.001) {
              var deltaM = (shiftPx / scaleFactor) / 1000.0;
              totalDist += deltaM;
              totalPxSinceStart += shiftPx;
              updateDistUI();
              checkDistanceAnnouncements(totalDist);

              if (dt > 0 && dt < 0.25) {
                speedSamples.push((Math.abs(deltaM) / dt) * 60.0);
              }
            }

            if (now - lastSpeedTime > 500) {
              if (speedSamples.length > 0) {
                var avg = speedSamples.reduce(function(a, b){ return a + b; }, 0) / speedSamples.length;
                currentSpeed = currentSpeed * 0.3 + avg * 0.7;
                speedSamples = [];
              } else {
                currentSpeed = 0.0;
              }
              txtSpeed.innerText = Math.max(0, currentSpeed).toFixed(1);
              updateDistUI();
              lastSpeedTime = now;
            }
          } else {
            txtSpeed.innerText = "0.0";
          }

          prevProf.set(curProf);
          hasPrevProf = true;
        }
      }
      requestAnimationFrame(mainLoop);
    }
  </script>
</body>
</html>
