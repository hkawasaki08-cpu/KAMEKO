<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .title { font-size: 14px; font-weight: bold; color: #4ade80; }
    #fps { font-size: 12px; color: #aaa; }

    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #dash {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .card {
      flex: 1;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
    }
    .card-lbl { font-size: 10px; color: #aaa; }
    .card-val { font-size: 24px; font-weight: bold; }
    .card-unit { font-size: 11px; color: #888; margin-left: 2px; }

    /* モード・スケール切替タブ */
    #scale-selector {
      position: absolute;
      top: 72px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }

    /* 動画コントローラー */
    #v-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 8px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .v-row { display: flex; gap: 4px; align-items: center; }
    .v-btn {
      flex: 1;
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 6px 0;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }

    footer {
      background: #111;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 10px));
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .btn-row { display: flex; gap: 6px; }
    button, label.btn {
      flex: 1;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 9px 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
    }
    button.green { background: #16a34a; border-color: #15803d; }
    button.orange { background: #d97706; border-color: #b45309; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">(仮称)カメラ式ケーブル距離計</div>
    <div id="fps">0 FPS</div>
  </header>

  <div id="stage">
    <video id="v" playsinline webkit-playsinline muted autoplay loop></video>
    <canvas id="c-proc" style="display:none;"></canvas>
    <canvas id="overlay"></canvas>

    <div id="dash">
      <div class="card">
        <div class="card-lbl">延線距離</div>
        <div><span id="txt-dist" class="card-val">0.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card">
        <div class="card-lbl">速度 (平均)</div>
        <div><span id="txt-speed" class="card-val">0.0</span><span class="card-unit">m/分</span></div>
      </div>
    </div>

    <!-- 画角モード切替ボタン -->
    <div id="scale-selector">
      <button class="tab-btn active" id="tab-close">近接 (約40cm / 2.5 px/mm)</button>
      <button class="tab-btn" id="tab-wide">引き (約80cm〜1m / 1.4 px/mm)</button>
    </div>

    <!-- 動画操作バー -->
    <div id="v-bar">
      <div style="display:flex; justify-content:space-between; font-size:10px; color:#38bdf8;">
        <span>🎬 動画コントローラー</span>
        <span id="v-time">0.0s</span>
      </div>
      <div class="v-row">
        <button class="v-btn" id="vb-b1">-1秒</button>
        <button class="v-btn" id="vb-bstep">◀ コマ戻</button>
        <button class="v-btn" id="vb-play" style="background:#0284c7;">一時停止 ⏸</button>
        <button class="v-btn" id="vb-fstep">コマ送 ▶</button>
        <button class="v-btn" id="vb-f1">+1秒</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="btn-row">
      <button id="b-m01">-0.1m</button>
      <button id="b-p01">+0.1m</button>
      <button id="b-set">数値設定</button>
      <button id="b-zero" style="color:#f87171;">0mリセット</button>
    </div>
    <div class="btn-row">
      <button id="b-pause" class="orange">一時停止 ⏸</button>
      <button id="b-cam" class="green">カメラ起動</button>
      <label class="btn" for="f-video">動画読込</label>
      <input type="file" id="f-video" accept="video/*">
    </div>
  </footer>

  <script>

    var totalDist = 0.0;
