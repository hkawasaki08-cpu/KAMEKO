<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    :root {
      --bg-color: #0b111e;
      --card-bg: #151f32;
      --accent-color: #00b4d8;
      --text-color: #f8fafc;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    
    /* ヘッダー・ステータス */
    .header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; }
    .status-badge { padding: 4px 10px; border-radius: 12px; background: #334155; font-size: 12px; }
    .status-badge.measuring { background: var(--success-color); color: #fff; }
    .status-badge.waiting { background: var(--warning-color); color: #000; }

    /* メイン数値パネル */
    .dashboard { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; }
    .dash-card { background: var(--card-bg); border-radius: 8px; padding: 8px; text-align: center; border: 1px solid #1e293b; }
    .dash-label { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
    .dash-val { font-size: 22px; font-weight: 800; font-feature-settings: "tnum"; }
    .dash-val small { font-size: 12px; font-weight: normal; margin-left: 2px; }

    /* モード・コントロール */
    .mode-bar { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; }
    button { background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
    button:active { filter: brightness(1.2); }
    button.active { background: var(--accent-color); border-color: var(--accent-color); color: #000; }

    /* ビューポート（カメラ/動画/Canvas） */
    .viewport-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    /* 検出枠ガイド */
    .guide-box {
      position: absolute; top: 25%; left: 5%; width: 90%; height: 50%;
      border: 2px solid #10b981; border-radius: 6px; box-sizing: border-box; pointer-events: none;
    }
    .guide-center-line {
      position: absolute; top: 0; left: 50%; width: 2px; height: 100%;
      background: rgba(239, 68, 68, 0.7); pointer-events: none;
    }

    /* 動画コントローラー */
    .video-controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .sub-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <span>(仮称)カメラ式ケーブル距離計 - KAMEKO</span>
    <span id="statusBadge" class="status-badge waiting">待機中（ヘッド通過待ち）</span>
  </div>

  <!-- ダッシュボード -->
  <div class="dashboard">
    <div class="dash-card">
      <div class="dash-label">延線距離</div>
      <div class="dash-val"><span id="distVal">0.00</span><small>m</small></div>
    </div>
    <div class="dash-card">
      <div class="dash-label">目標残 (<span id="targetLabel">49</span>m)</div>
      <div class="dash-val" style="color: var(--accent-color);"><span id="remainVal">49.00</span><small>m</small></div>
    </div>
    <div class="dash-card">
      <div class="dash-label">速度</div>
      <div class="dash-val"><span id="speedVal">0.0</span><small>m/分</small></div>
    </div>
  </div>

  <!-- モード切替 -->
  <div class="mode-bar">
    <button id="tapeColorBtn" onclick="toggleTapeColor()">黄テープ検知</button>
    <button id="manualModeBtn" onclick="setMode('MANUAL')">✋ 手動モード</button>
    <button id="autoModeBtn" class="active" onclick="setMode('AUTO')">🎯 自動テープ検知</button>
  </div>

  <!-- カメラ/映像表示エリア -->
  <div class="viewport-container">
    <video id="videoEl" playsinline muted style="display:none;"></video>
    <canvas id="viewCanvas"></canvas>
    <div class="guide-box">
      <div class="guide-center-line"></div>
    </div>
  </div>

  <!-- 動画再生コントローラー -->
  <div class="video-controls">
    <button onclick="seekVideo(-1)">-1秒</button>
    <button onclick="stepFrame(-1)">◀ コマ</button>
    <button id="playBtn" onclick="togglePlay()">再生 ▶</button>
    <button onclick="stepFrame(1)">コマ ▶</button>
    <button onclick="seekVideo(1)">+1秒</button>
  </div>

  <!-- 下部操作アクション -->
  <div class="sub-controls">
    <button onclick="startCamera()" style="background:#059669;">カメラ起動</button>
    <button onclick="document.getElementById('fileInput').click()">動画読込</button>
    <input type="file" id="fileInput" accept="video/*" style="display:none;" onchange="loadVideoFile(this)">
    <button onclick="setTargetDist()">目標m</button>
    <button onclick="resetDist()" style="background:#dc2626;">0mリセット</button>
  </div>

  <script>
    // --- 状態管理変数 ---
    let state = {
      mode: 'AUTO',             // 'AUTO' | 'MANUAL'
      status: 'WAITING',        // 'WAITING' | 'MEASURING' | 'STOPPED'
      targetTapeColor: 'YELLOW',// 'YELLOW' | 'WHITE'
      totalDistance: 0.0,
      targetDistance: 49.0,
      speedMpm: 0.0,
      pixelsPerMeter: 1200.0,   // キャリブレーション値（px/m）
      lastProcessTime: performance.now(),
      prevRoiGray: null
    };

    const video = document.getElementById('videoEl');
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // --- UI更新 ---
    function updateUI() {
      document.getElementById('distVal').innerText = state.totalDistance.toFixed(2);
      const remain = Math.max(0, state.targetDistance - state.totalDistance);
      document.getElementById('remainVal').innerText = remain.toFixed(2);
      document.getElementById('speedVal').innerText = state.speedMpm.toFixed(1);

      const badge = document.getElementById('statusBadge');
      if (state.status === 'WAITING') {
        badge.className = 'status-badge waiting';
        badge.innerText = '待機中（ヘッド通過待ち）';
      } else if (state.status === 'MEASURING') {
        badge.className = 'status-badge measuring';
        badge.innerText = '測定中（オプティカルフロー）';
      } else {
        badge.className = 'status-badge';
        badge.innerText = '一時停止';
      }
    }

    function setMode(mode) {
      state.mode = mode;
      document.getElementById('autoModeBtn').classList.toggle('active', mode === 'AUTO');
      document.getElementById('manualModeBtn').classList.toggle('active', mode === 'MANUAL');
      if (mode === 'MANUAL') {
        state.status = 'MEASURING';
      } else {
        state.status = 'WAITING';
      }
      updateUI();
    }

    function toggleTapeColor() {
      state.targetTapeColor = (state.targetTapeColor === 'YELLOW') ? 'WHITE' : 'YELLOW';
      document.getElementById('tapeColorBtn').innerText = (state.targetTapeColor === 'YELLOW') ? '黄テープ検知' : '白テープ検知';
    }

    function resetDist() {
      state.totalDistance = 0.0;
      state.speedMpm = 0.0;
      state.status = (state.mode === 'AUTO') ? 'WAITING' : 'MEASURING';
      state.prevRoiGray = null;
      updateUI();
    }

    function setTargetDist() {
      const val = prompt('目標距離 (m) を入力してください:', state.targetDistance);
      if (val && !isNaN(val)) {
        state.targetDistance = parseFloat(val);
        document.getElementById('targetLabel').innerText = state.targetDistance;
        updateUI();
      }
    }

    // --- 映像処理・ループ ---
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await video.play();
        setupCanvas();
        startProcessingLoop();
      } catch (err) {
        alert('カメラ起動失敗: ' + err.message);
      }
    }

    function loadVideoFile(input) {
      if (!input.files || !input.files[0]) return;
      video.srcObject = null;
      video.src = URL.createObjectURL(input.files[0]);
      video.load();
      video.onloadeddata = () => {
        setupCanvas();
        resetDist();
        startProcessingLoop();
      };
    }

    function setupCanvas() {
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
    }

    function togglePlay() {
      if (video.paused) {
        video.play();
        document.getElementById('playBtn').innerText = '停止 ⏸';
      } else {
        video.pause();
        document.getElementById('playBtn').innerText = '再生 ▶';
      }
    }

    function seekVideo(sec) {
      video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + sec));
    }

    function stepFrame(frames) {
      video.pause();
      document.getElementById('playBtn').innerText = '再生 ▶';
      video.currentTime += frames * (1 / 30);
    }

    // --- メイン処理ループ ---
    function startProcessingLoop() {
      const processFrame = () => {
        if (!video.paused && !video.ended) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          runAnalysis();
        }
        if ('requestVideoFrameCallback' in video && video.srcObject === null) {
          video.requestVideoFrameCallback(processFrame);
        } else {
          requestAnimationFrame(processFrame);
        }
      };
      
      if ('requestVideoFrameCallback' in video && video.srcObject === null) {
        video.requestVideoFrameCallback(processFrame);
      } else {
        requestAnimationFrame(processFrame);
      }
    }

    // --- 解析ロジック（テープ検知 ＆ 移動量積算） ---
    function runAnalysis() {
      const now = performance.now();
      const dt = (now - state.lastProcessTime) / 1000;
      state.lastProcessTime = now;

      // 検出ROI（関心領域）座標（緑枠内）
      const rx = Math.floor(canvas.width * 0.05);
      const ry = Math.floor(canvas.height * 0.25);
      const rw = Math.floor(canvas.width * 0.90);
      const rh = Math.floor(canvas.height * 0.50);

      const frameData = ctx.getImageData(rx, ry, rw, rh);
      const data = frameData.data;

      // 1. テープ検知処理（待機中の場合）
      if (state.mode === 'AUTO' && state.status === 'WAITING') {
        let matchedPixels = 0;
        const totalPixels = rw * rh;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];

          if (state.targetTapeColor === 'YELLOW') {
            // 黄色判定: R, Gが高く、Bが低い
            if (r > 130 && g > 120 && b < 80 && (r + g) > (b * 2.5)) {
              matchedPixels++;
            }
          } else {
            // 白色判定: 明度が高くRGBバランスが均等
            if (r > 190 && g > 190 && b > 190 && Math.abs(r - g) < 20 && Math.abs(g - b) < 20) {
              matchedPixels++;
            }
          }
        }

        const ratio = matchedPixels / totalPixels;
        // 枠内の1.0%以上に該当色が出現したら即座に測定開始トリガー
        if (ratio > 0.010) {
          state.status = 'MEASURING';
          state.prevRoiGray = null;
          updateUI();
        }
        return;
      }

      // 2. 距離積算処理（測定中の場合）
      if (state.status === 'MEASURING') {
        // グレースケール化
        const gray = new Uint8Array(rw * rh);
        for (let i = 0, j = 0; i < data.length; i += 4, j++) {
          gray[j] = (data[i] * 299 + data[i+1] * 587 + data[i+2] * 114) / 1000;
        }

        if (state.prevRoiGray) {
          // 簡易1次元相関によるX方向移動量（オプティカルフロー）算出
          const shiftPx = calculateHorizontalShift(state.prevRoiGray, gray, rw, rh);
          
          if (shiftPx > 0 && shiftPx < 80) { // 有効範囲の移動
            const deltaM = shiftPx / state.pixelsPerMeter;
            state.totalDistance += deltaM;

            if (dt > 0) {
              const currentMpm = (deltaM / dt) * 60;
              state.speedMpm = state.speedMpm * 0.8 + currentMpm * 0.2; // 移動平均
            }
            updateUI();
          }
        }
        state.prevRoiGray = gray;
      }
    }

    // 水平方向（左→右）の移動ピクセル検出（相関演算）
    function calculateHorizontalShift(prev, curr, w, h) {
      const stepY = 8; // 高速化のため間引き
      const maxShift = 40;
      let bestShift = 0;
      let minDiff = Infinity;

      for (let s = 0; s <= maxShift; s += 2) {
        let diff = 0;
        let count = 0;
        for (let y = 0; y < h; y += stepY) {
          const row = y * w;
          for (let x = 0; x < w - maxShift; x += 10) {
            diff += Math.abs(prev[row + x] - curr[row + x + s]);
            count++;
          }
        }
        if (count > 0 && diff / count < minDiff) {
          minDiff = diff / count;
          bestShift = s;
        }
      }
      return bestShift;
    }
  </script>
</body>
</html>
