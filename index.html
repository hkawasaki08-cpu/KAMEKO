<!DOCTYPE html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #mic-status { font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
    .mic-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .mic-dot.active { background: #ef4444; }

    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #dash {
      position: absolute;
      top: 8px;
      left: 6px;
      right: 6px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .card {
      flex: 1;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
    }
    .card-lbl { font-size: 9px; color: #aaa; }
    .card-val { font-size: 21px; font-weight: bold; font-variant-numeric: tabular-nums; }
    .card-unit { font-size: 10px; color: #888; margin-left: 1px; }

    #scale-selector {
      position: absolute;
      top: 72px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }

    #v-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 8px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 5px;
    }
    .v-row { display: flex; gap: 4px; align-items: center; }
    .v-btn {
      flex: 1;
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 0;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
    }
    .speed-btn {
      flex: 1;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 3px 0;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .speed-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
