<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(20, 20, 20, 0.95);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    h1 { font-size: 14px; font-weight: 600; color: #4ade80; }
    #fps-display { font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; }

    #viewport-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .metric-card {
      flex: 1;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }
    .metric-label { font-size: 10px; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
    .metric-value { font-size: 26px; font-weight: bold; color: #fff; font-variant-numeric: tabular-nums; }
    .metric-unit { font-size: 12px; color: #888; margin-left: 2px; }

    #status-msg {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444;
      color: #38bdf8;
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 11px;
      z-index: 25;
      white-space: nowrap;
    }

    footer {
      background: rgba(20, 20, 20, 0.95);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .btn-row { display: flex; gap: 6px; }
    button, label.btn {
      flex: 1;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { background: #16a34a; border-color: #15803d; }
    button.pause { background: #d97706; border-color: #b45309; }
    button.resume { background: #2563eb; border-color: #1d4ed8; }
    button.num-btn { background: #374151; font-weight: bold; }
    input[type="file"] { display: none; }

    /* モーダルテンキー（カメラをフリーズさせない独自UI） */
    #num-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 16px;
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #numpad-display {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      font-size: 24px;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: right;
      font-family: monospace;
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .numpad-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
    }
    .numpad-btn:active { background: #475569; }
  </style>
</head>
<body>

  <header>
    <h1>(仮称)カメラ式ケーブル距離計</h1>
    <span id="fps-display">0.0 FPS</span>
  </header>

  <div id="viewport-container">
    <video id="input-video" playsinline webkit-playsinline muted autoplay loop></video>
    <canvas id="proc-canvas" style="display:none;"></canvas>
    <canvas id="overlay-canvas"></canvas>

    <div id="dashboard">
      <div class="metric-card" id="card-dist">
        <div class="metric-label">延線距離</div>
        <div><span id="dist-val" class="metric-value">0.00</span><span class="metric-unit">m</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">延線速度 (平均)</div>
        <div><span id="speed-val" class="metric-value">0.0</span><span class="metric-unit">m/分</span></div>
      </div>
    </div>

    <div id="status-msg">緑枠を上下にドラッグしてケーブルに合わせてください</div>
  </div>

  <footer>
    <div class="btn-row">
      <button id="btn-minus" class="num-btn">-0.1m</button>
      <button id="btn-plus" class="num-btn">+0.1m</button>
      <button id="btn-input" class="num-btn">数値入力</button>
      <button id="reset-btn" style="color: #f87171; background: #2f1c1c;">0mリセット</button>
    </div>
    <div class="btn-row">
      <button id="pause-btn" class="pause">一時停止 ⏸</button>
      <button id="cam-btn" class="primary">カメラ起動</button>
      <label class="btn" for="video-input">動画読込</label>
      <input type="file" id="video-input" accept="video/*">
    </div>
  </footer>

  <!-- テンキーモーダル -->
  <div id="num-modal">
    <div class="modal-box">
      <div style="font-size:12px; color:#94a3b8;">距離入力 (m)</div>
      <div id="numpad-display">0.00</div>
      <div class="numpad-grid">
        <button class="numpad-btn" onclick="numKey('7')">7</button>
        <button class="numpad-btn" onclick="numKey('8')">8</button>
        <button class="numpad-btn" onclick="numKey('9')">9</button>
        <button class="numpad-btn" onclick="numKey('4')">4</button>
        <button class="numpad-btn" onclick="numKey('5')">5</button>
        <button class="numpad-btn" onclick="numKey('6')">6</button>
        <button class="numpad-btn" onclick="numKey('1')">1</button>
        <button class="numpad-btn" onclick="numKey('2')">2</button>
        <button class="numpad-btn" onclick="numKey('3')">3</button>
        <button class="numpad-btn" onclick="numKey('C')" style="color:#f87171;">C</button>
        <button class="numpad-btn" onclick="numKey('0')">0</button>
        <button class="numpad-btn" onclick="numKey('.')">.</button>
      </div>
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button class="numpad-btn" onclick="closeNumModal(false)" style="flex:1; background:#475569;">取消</button>
        <button class="numpad-btn" onclick="closeNumModal(true)" style="flex:1; background:#16a34a;">確定</button>
      </div>
    </div>
  </div>

  <script>
    let scale_px_per_mm = 2.5;
    let totalDistanceMeters = 0.0;
    let isTracking = false;
    let isPaused = false;
    let lastTimestamp = performance.now();
    let frameCounter = 0;
    let lastFpsUpdate = performance.now();

    let speedSamples = [];
    let lastSpeedUpdate = performance.now();
    let smoothedSpeed = 0.0;

    // 枠の位置（初期位置をやや下寄りの55%に配置）
    let boxYRatio = 0.55;

    const video = document.getElementById('input-video');
    const procCanvas = document.getElementById('proc-canvas');
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const distEl = document.getElementById('dist-val');
    const speedEl = document.getElementById('speed-val');
    const statusMsg = document.getElementById('status-msg');
    const fpsEl = document.getElementById('fps-display');
    const pauseBtn = document.getElementById('pause-btn');

    let prevProfile = null;
    let isBusyProcessing = false;

    // カメラ起動
    document.getElementById('cam-btn').addEventListener('click', async () => {
      statusMsg.innerText = "カメラ起動中...";
      try {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        await video.play();
        statusMsg.innerText = "測定中（枠をドラッグして位置調整可）";
        isPaused = false;
        pauseBtn.className = 'pause';
        pauseBtn.innerText = '一時停止 ⏸';
        startProcessing();
      } catch (err) {
        alert("カメラ起動失敗: " + err.message);
      }
    });

    // 動画読込
    document.getElementById('video-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      video.src = URL.createObjectURL(file);
      await video.play();
      isPaused = false;
      pauseBtn.className = 'pause';
      pauseBtn.innerText = '一時停止 ⏸';
      startProcessing();
    });

    // 一時停止 / 再開
    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.className = 'resume';
        pauseBtn.innerText = '測定再開 ▶';
        statusMsg.innerText = "測定一時停止中";
        speedEl.innerText = "0.0";
      } else {
        pauseBtn.className = 'pause';
        pauseBtn.innerText = '一時停止 ⏸';
        statusMsg.innerText = "測定中";
        prevProfile = null;
      }
    });

    // 手動加減算
    document.getElementById('btn-plus').addEventListener('click', () => {
      totalDistanceMeters += 0.1;
      updateDistUI();
    });
    document.getElementById('btn-minus').addEventListener('click', () => {
      totalDistanceMeters = Math.max(0, totalDistanceMeters - 0.1);
      updateDistUI();
    });

    // 0mリセット（iOSフリーズの原因だったダイアログを全廃し、即時ゼロクリア）
    document.getElementById('reset-btn').addEventListener('click', () => {
      totalDistanceMeters = 0.0;
      speedSamples = [];
      smoothedSpeed = 0.0;
      updateDistUI();
      speedEl.innerText = "0.0";
      statusMsg.innerText = "0.00m にリセットしました";
      setTimeout(() => { if (!isPaused) statusMsg.innerText = "測定中"; }, 1500);
    });

    function updateDistUI() {
      distEl.innerText = totalDistanceMeters.toFixed(2);
    }

    // --- テンキー操作（ダイアログなしで安全に入力） ---
    let numStr = "0";
    const numModal = document.getElementById('num-modal');
    const numDisplay = document.getElementById('numpad-display');

    document.getElementById('btn-input').addEventListener('click', () => {
      numStr = totalDistanceMeters.toFixed(2);
      numDisplay.innerText = numStr;
      numModal.style.display = 'flex';
    });

    function numKey(k) {
      if (k === 'C') {
        numStr = "0";
      } else if (k === '.') {
        if (!numStr.includes('.')) numStr += '.';
      } else {
        numStr = (numStr === "0") ? k : numStr + k;
      }
      numDisplay.innerText = numStr;
    }

    function closeNumModal(apply) {
      if (apply) {
        const v = parseFloat(numStr);
        if (!isNaN(v)) {
          totalDistanceMeters = Math.max(0, v);
          updateDistUI();
        }
      }
      numModal.style.display = 'none';
    }

    // --- 枠のドラッグ移動 ---
    const vContainer = document.getElementById('viewport-container');
    let isDragging = false;
    vContainer.addEventListener('pointerdown', (e) => { isDragging = true; });
    vContainer.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const rect = vContainer.getBoundingClientRect();
      const relY = (e.clientY - rect.top) / rect.height;
      boxYRatio = Math.max(0.2, Math.min(0.8, relY));
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    function startProcessing() {
      if (isTracking) return;
      isTracking = true;
      requestAnimationFrame(processLoop);
    }

    // 解析ループ
    function processLoop(timestamp) {
      if (!isTracking) return;

      const cw = vContainer.clientWidth;
      const ch = vContainer.clientHeight;

      if (overlayCanvas.width !== cw || overlayCanvas.height !== ch) {
        overlayCanvas.width = cw;
        overlayCanvas.height = ch;
      }

      const boxW = Math.floor(cw * 0.88);
      const boxH = 65;
      const boxX = Math.floor((cw - boxW) / 2);
      const boxY = Math.floor(ch * boxYRatio - boxH / 2);

      drawOverlay(boxX, boxY, boxW, boxH);

      if (!isBusyProcessing && video.readyState >= 2 && video.videoWidth > 0 && !video.paused) {
        isBusyProcessing = true;

        try {
          const procW = 160;
          const procH = 20;
          if (procCanvas.width !== procW || procCanvas.height !== procH) {
            procCanvas.width = procW;
            procCanvas.height = procH;
          }

          const vw = video.videoWidth;
          const vh = video.videoHeight;
          const scale = Math.max(cw / vw, ch / vh);
          const renderedW = vw * scale;
          const renderedH = vh * scale;
          const offsetX = (cw - renderedW) / 2;
          const offsetY = (ch - renderedH) / 2;

          const srcX = Math.max(0, (boxX - offsetX) / scale);
          const srcY = Math.max(0, (boxY - offsetY) / scale);
          const srcW = Math.min(vw - srcX, boxW / scale);
          const srcH = Math.min(vh - srcY, boxH / scale);

          procCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, procW, procH);
          const frameData = procCtx.getImageData(0, 0, procW, procH);

          const currProfile = computeProfile(frameData.data, procW, procH);

          if (!isPaused && prevProfile) {
            const shift = computeShift(prevProfile, currProfile);
            const shiftPx = shift * (srcW / procW);
            const deltaM = (shiftPx / scale_px_per_mm) / 1000.0;
            const dt = (timestamp - lastTimestamp) / 1000.0;

            if (Math.abs(deltaM) < 0.04 && Math.abs(deltaM) > 0.0006) {
              totalDistanceMeters += deltaM;
              updateDistUI();

              if (dt > 0 && dt < 0.25) {
                const instSpeed = (deltaM / dt) * 60.0;
                speedSamples.push(Math.max(0, instSpeed));
              }
            } else {
              speedSamples.push(0);
            }

            if (timestamp - lastSpeedUpdate > 500) {
              if (speedSamples.length > 0) {
                const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                smoothedSpeed = smoothedSpeed * 0.3 + avg * 0.7;
                speedSamples = [];
              } else {
                smoothedSpeed = 0.0;
              }
              speedEl.innerText = Math.max(0, smoothedSpeed).toFixed(1);
              lastSpeedUpdate = timestamp;
            }
          }
          prevProfile = currProfile;
        } catch (e) {
          console.error(e);
        } finally {
          isBusyProcessing = false;
        }

        frameCounter++;
        if (timestamp - lastFpsUpdate > 1000) {
          fpsEl.innerText = `${frameCounter} FPS`;
          frameCounter = 0;
          lastFpsUpdate = timestamp;
        }
      }

      lastTimestamp = timestamp;
      requestAnimationFrame(processLoop);
    }

    function computeProfile(data, w, h) {
      const prof = new Float32Array(w);
      for (let x = 0; x < w; x++) {
        let sum = 0, count = 0;
        for (let y = 0; y < h; y++) {
          const idx = (y * w + x) * 4;
          const gray = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
          if (gray < 235) {
            sum += gray;
            count++;
          }
        }
        prof[x] = count > 0 ? sum / count : 0;
      }
      return prof;
    }

    function computeShift(prev, curr) {
      const maxSearch = 10;
      let bestShift = 0;
      let minDiff = Infinity;
      for (let s = -maxSearch; s <= maxSearch; s++) {
        let diff = 0, count = 0;
        for (let i = maxSearch; i < prev.length - maxSearch; i++) {
          diff += Math.abs(prev[i] - curr[i + s]);
          count++;
        }
        if (count > 0 && diff < minDiff) {
          minDiff = diff;
          bestShift = s;
        }
      }
      return bestShift;
    }

    function drawOverlay(x, y, w, h) {
      const ctx = overlayCtx;
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      ctx.strokeStyle = isPaused ? '#94a3b8' : '#22c55e';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      const c = 10;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y + c); ctx.lineTo(x, y); ctx.lineTo(x + c, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w - c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + c); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + h - c); ctx.lineTo(x, y + h); ctx.lineTo(x + c, y + h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w - c, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - c); ctx.stroke();

      ctx.fillStyle = isPaused ? '#94a3b8' : '#22c55e';
      ctx.font = '11px sans-serif';
      ctx.fillText(isPaused ? '⏸ 一時停止中' : '🎯 ケーブル枠 (上下にドラッグ可)', x, y - 6);
    }
  </script>
</body>
</html>
