<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #121212;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1f1f1f;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    h1 { font-size: 15px; font-weight: 600; color: #4ade80; }
    #fps-display { font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; }

    #viewport-container {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #overlay-canvas { z-index: 10; pointer-events: none; }

    #dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .metric-card {
      flex: 1;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      cursor: pointer;
    }
    .metric-label { font-size: 10px; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
    .metric-value { font-size: 24px; font-weight: bold; color: #fff; font-variant-numeric: tabular-nums; }
    .metric-unit { font-size: 12px; color: #888; margin-left: 2px; }

    #status-msg {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444;
      color: #38bdf8;
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 11px;
      z-index: 25;
      white-space: nowrap;
    }

    footer {
      background: #1f1f1f;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .btn-row { display: flex; gap: 6px; }
    button, label.btn {
      flex: 1;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { background: #16a34a; border-color: #15803d; }
    button.pause { background: #d97706; border-color: #b45309; }
    button.resume { background: #2563eb; border-color: #1d4ed8; }
    button.num-btn { background: #374151; font-weight: bold; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>(仮称)カメラ式ケーブル距離計</h1>
    <span id="fps-display">0.0 FPS</span>
  </header>

  <div id="viewport-container">
    <!-- iOS Safariでインライン再生させるための必須属性 -->
    <video id="input-video" playsinline webkit-playsinline muted autoplay loop></video>
    <canvas id="proc-canvas" style="display:none;"></canvas>
    <canvas id="overlay-canvas"></canvas>

    <div id="dashboard">
      <div class="metric-card" id="card-dist">
        <div class="metric-label">延線距離 (タップで入力)</div>
        <div><span id="dist-val" class="metric-value">0.00</span><span class="metric-unit">m</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">延線速度 (平均)</div>
        <div><span id="speed-val" class="metric-value">0.0</span><span class="metric-unit">m/分</span></div>
      </div>
    </div>

    <div id="status-msg">下の「カメラ起動」または「動画読込」を押してください</div>
  </div>

  <footer>
    <div class="btn-row">
      <button id="btn-minus" class="num-btn">-0.1m</button>
      <button id="btn-plus" class="num-btn">+0.1m</button>
      <button id="btn-input" class="num-btn">数値入力</button>
      <button id="reset-btn" style="color: #f87171;">0mリセット</button>
    </div>
    <div class="btn-row">
      <button id="pause-btn" class="pause">一時停止 ⏸</button>
      <button id="cam-btn" class="primary">カメラ起動</button>
      <label class="btn" for="video-input">動画読込</label>
      <input type="file" id="video-input" accept="video/*">
    </div>
  </footer>

  <script>
    let scale_px_per_mm = 2.8;
    let totalDistanceMeters = 0.0;
    let isTracking = false;
    let isPaused = false;
    let lastTimestamp = performance.now();
    let frameCounter = 0;
    let lastFpsUpdate = performance.now();

    let speedSamples = [];
    let lastSpeedUpdate = performance.now();
    let smoothedSpeed = 0.0;

    const video = document.getElementById('input-video');
    const procCanvas = document.getElementById('proc-canvas');
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const distEl = document.getElementById('dist-val');
    const speedEl = document.getElementById('speed-val');
    const statusMsg = document.getElementById('status-msg');
    const fpsEl = document.getElementById('fps-display');
    const pauseBtn = document.getElementById('pause-btn');

    let prevCableProfile = null;
    let prevBgProfile = null;

    // カメラ起動処理（iOS対応強化）
    document.getElementById('cam-btn').addEventListener('click', async () => {
      statusMsg.innerText = "カメラをリクエスト中...";
      try {
        // iOS Safari向け制約
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        video.muted = true;
        
        await video.play();
        statusMsg.innerText = "カメラ接続完了";
        isPaused = false;
        pauseBtn.className = 'pause';
        pauseBtn.innerText = '一時停止 ⏸';
        startProcessing();
      } catch (err) {
        statusMsg.innerText = "カメラ起動エラー: " + err.name;
        alert("カメラ起動に失敗しました。\n・Safariの設定でカメラ許可を確認してください\n・HTTPSでアクセスしているか確認してください\n\n詳細: " + err.message);
      }
    });

    // テスト動画ファイル読み込み
    document.getElementById('video-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      statusMsg.innerText = "動画を読み込み中...";
      try {
        video.srcObject = null;
        video.src = URL.createObjectURL(file);
        video.muted = true;
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        await video.play();
        statusMsg.innerText = "動画再生中";
        isPaused = false;
        pauseBtn.className = 'pause';
        pauseBtn.innerText = '一時停止 ⏸';
        startProcessing();
      } catch (err) {
        statusMsg.innerText = "動画再生エラー: " + err.message;
      }
    });

    // 一時停止 / 再開
    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.className = 'resume';
        pauseBtn.innerText = '測定再開 ▶';
        statusMsg.innerText = "測定一時停止中";
        speedEl.innerText = "0.0";
      } else {
        pauseBtn.className = 'pause';
        pauseBtn.innerText = '一時停止 ⏸';
        statusMsg.innerText = "測定中";
        prevCableProfile = null;
        prevBgProfile = null;
      }
    });

    // 手動加減算
    document.getElementById('btn-plus').addEventListener('click', () => {
      totalDistanceMeters += 0.1;
      updateDistUI();
    });
    document.getElementById('btn-minus').addEventListener('click', () => {
      totalDistanceMeters = Math.max(0, totalDistanceMeters - 0.1);
      updateDistUI();
    });

    // 数値直接入力
    function promptManualDist() {
      const input = prompt('現在の距離(m)を入力:', totalDistanceMeters.toFixed(2));
      if (input !== null && !isNaN(parseFloat(input))) {
        totalDistanceMeters = Math.max(0, parseFloat(input));
        updateDistUI();
      }
    }
    document.getElementById('btn-input').addEventListener('click', promptManualDist);
    document.getElementById('card-dist').addEventListener('click', promptManualDist);

    // 0mリセット
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm('0.00m にリセットしますか？')) {
        totalDistanceMeters = 0.0;
        speedSamples = [];
        smoothedSpeed = 0.0;
        updateDistUI();
        speedEl.innerText = "0.0";
      }
    });

    function updateDistUI() {
      distEl.innerText = totalDistanceMeters.toFixed(2);
    }

    function startProcessing() {
      if (isTracking) return;
      isTracking = true;
      requestAnimationFrame(processLoop);
    }

    // 解析ループ
    function processLoop(timestamp) {
      if (!isTracking) return;

      if (video.readyState >= 2 && video.videoWidth > 0) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        if (overlayCanvas.width !== overlayCanvas.clientWidth || overlayCanvas.height !== overlayCanvas.clientHeight) {
          overlayCanvas.width = overlayCanvas.clientWidth;
          overlayCanvas.height = overlayCanvas.clientHeight;
        }

        const pw = 320;
        const ph = Math.floor(vh * (pw / vw));
        if (procCanvas.width !== pw || procCanvas.height !== ph) {
          procCanvas.width = pw;
          procCanvas.height = ph;
        }

        procCtx.drawImage(video, 0, 0, pw, ph);

        const cableY = Math.floor(ph * 0.4);
        const cableH = Math.max(10, Math.floor(ph * 0.2));
        const cableImg = procCtx.getImageData(0, cableY, pw, cableH);

        const bgY = Math.floor(ph * 0.08);
        const bgH = Math.max(8, Math.floor(ph * 0.1));
        const bgImg = procCtx.getImageData(0, bgY, pw, bgH);

        const currCableProfile = computeProfile(cableImg.data, pw, cableH, true);
        const currBgProfile = computeProfile(bgImg.data, pw, bgH, false);

        if (!isPaused && prevCableProfile && prevBgProfile) {
          const shiftCable = computeShift(prevCableProfile, currCableProfile);
          const shiftBg = computeShift(prevBgProfile, currBgProfile);

          let effectiveShift = shiftCable;
          if (Math.abs(shiftBg) <= 6) {
            effectiveShift = shiftCable - shiftBg;
          }

          const shiftPx = effectiveShift * (vw / pw);
          const deltaM = (shiftPx / scale_px_per_mm) / 1000.0;
          const dt = (timestamp - lastTimestamp) / 1000.0;

          if (Math.abs(deltaM) < 0.05 && Math.abs(deltaM) > 0.0005) {
            totalDistanceMeters += deltaM;
            updateDistUI();

            if (dt > 0 && dt < 0.2) {
              const instSpeed = (deltaM / dt) * 60.0;
              speedSamples.push(Math.max(0, instSpeed));
            }
          } else {
            speedSamples.push(0);
          }

          if (timestamp - lastSpeedUpdate > 500) {
            if (speedSamples.length > 0) {
              const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
              smoothedSpeed = smoothedSpeed * 0.3 + avg * 0.7;
              speedSamples = [];
            } else {
              smoothedSpeed = 0.0;
            }
            speedEl.innerText = Math.max(0, smoothedSpeed).toFixed(1);
            lastSpeedUpdate = timestamp;
          }
        }

        prevCableProfile = currCableProfile;
        prevBgProfile = currBgProfile;

        drawOverlay(overlayCanvas.width, overlayCanvas.height);

        frameCounter++;
        if (timestamp - lastFpsUpdate > 1000) {
          fpsEl.innerText = `${frameCounter} FPS`;
          frameCounter = 0;
          lastFpsUpdate = timestamp;
        }
      }

      lastTimestamp = timestamp;
      requestAnimationFrame(processLoop);
    }

    function computeProfile(data, w, h, filterSpecular) {
      const prof = new Float32Array(w);
      for (let x = 0; x < w; x++) {
        let sum = 0, count = 0;
        for (let y = 0; y < h; y++) {
          const idx = (y * w + x) * 4;
          const gray = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
          if (!filterSpecular || gray < 235) {
            sum += gray;
            count++;
          }
        }
        prof[x] = count > 0 ? sum / count : 0;
      }
      return prof;
    }

    function computeShift(prev, curr) {
      const maxSearch = 12;
      let bestShift = 0;
      let minDiff = Infinity;
      for (let s = -maxSearch; s <= maxSearch; s++) {
        let diff = 0, count = 0;
        for (let i = maxSearch; i < prev.length - maxSearch; i++) {
          diff += Math.abs(prev[i] - curr[i + s]);
          count++;
        }
        if (count > 0 && diff < minDiff) {
          minDiff = diff;
          bestShift = s;
        }
      }
      return bestShift;
    }

    function drawOverlay(w, h) {
      const ctx = overlayCtx;
      ctx.clearRect(0, 0, w, h);

      const roiTop = h * 0.4;
      const roiHeight = h * 0.2;
      ctx.strokeStyle = isPaused ? '#94a3b8' : '#22c55e';
      ctx.lineWidth = 2;
      ctx.setLineDash(isPaused ? [4, 4] : []);
      ctx.strokeRect(w * 0.1, roiTop, w * 0.8, roiHeight);

      ctx.fillStyle = isPaused ? '#94a3b8' : '#22c55e';
      ctx.font = '11px sans-serif';
      ctx.fillText(isPaused ? '一時停止中' : 'ケーブル測定領域', w * 0.1, roiTop - 6);
    }
  </script>
</body>
</html>
