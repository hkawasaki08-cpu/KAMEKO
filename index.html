<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #fps { font-size: 11px; color: #aaa; }

    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #111;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ケーブル測定枠 */
    #target-box {
      position: absolute;
      top: 55%;
      left: 4%;
      width: 92%;
      height: 90px;
      border: 2px solid #22c55e;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      padding: 4px;
    }
    .box-tag {
      font-size: 10px;
      color: #22c55e;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 2px;
    }

    /* ダッシュボード */
    #dash {
      position: absolute;
      top: 8px;
      left: 6px;
      right: 6px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .card {
      flex: 1;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
    }
    .card-lbl { font-size: 9px; color: #aaa; }
    .card-val { font-size: 20px; font-weight: bold; }
    .card-unit { font-size: 10px; color: #888; margin-left: 1px; }

    #scale-selector {
      position: absolute;
      top: 68px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
