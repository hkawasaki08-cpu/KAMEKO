<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    header {
      background: #1e293b;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    #fps { font-size: 12px; color: #94a3b8; font-variant-numeric: tabular-nums; }

    #viewport {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #overlay-canvas { z-index: 10; pointer-events: none; }

    /* ダッシュボード */
    #dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .card {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
    }
    .card-label { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
    .card-val { font-size: 26px; font-weight: bold; color: #fff; font-variant-numeric: tabular-nums; }
    .card-unit { font-size: 12px; color: #64748b; margin-left: 2px; }

    /* ステータスバー */
    #status-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #475569;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      z-index: 25;
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .status-dot.warn { background: #eab308; }
    .status-dot.danger { background: #ef4444; }
    .status-dot.paused { background: #64748b; }

    /* コントロールフッター */
    footer {
      background: #1e293b;
      padding: 10px 12px 14px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }
    .btn-row { display: flex; gap: 6px; }
    button, label.btn-file {
      flex: 1;
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { background: #0284c7; border-color: #0369a1; }
    button.pause { background: #d97706; border-color: #b45309; }
    button.resume { background: #16a34a; border-color: #15803d; }
    button.adjust { background: #1e293b; border-color: #475569; font-weight: bold; font-size: 14px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">(仮称)カメラ式ケーブル距離計</div>
    <div id="fps">-- FPS</div>
  </header>

  <div id="viewport">
    <video id="v-elem" playsinline muted loop></video>
    <canvas id="calc-canvas" style="display:none;"></canvas>
    <canvas id="overlay-canvas"></canvas>

    <div id="dashboard">
      <div class="card" id="card-dist" style="cursor: pointer;">
        <div class="card-label">延線距離 (タップで直接編集)</div>
        <div><span id="txt-dist" class="card-val">0.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card">
        <div class="card-label">平均速度 (0.5s更新)</div>
        <div><span id="txt-speed" class="card-val">0.0</span><span class="card-unit">m/分</span></div>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">待機中</span>
    </div>
  </div>

  <footer>
    <!-- 段1：手動加減算 (+0.1m / -0.1m) ＆ 直接入力 -->
    <div class="btn-row">
      <button id="btn-minus" class="adjust">-0.1m</button>
      <button id="btn-plus" class="adjust">+0.1m</button>
      <button id="btn-direct-input" class="adjust">数値直接入力</button>
      <button id="btn-reset" class="adjust" style="color: #ef4444;">0mリセット</button>
    </div>

    <!-- 段2：計測一時停止 / 再開 ＆ カメラ起動 -->
    <div class="btn-row">
      <button id="btn-toggle-pause" class="pause">一時停止 ⏸</button>
      <button id="btn-cam" class="primary">iPhoneカメラ起動</button>
      <label class="btn-file" for="file-video">動画テスト</label>
      <input type="file" id="file-video" accept="video/*">
    </div>
  </footer>

  <script>
    // --- 測定パラメータ ---
    let scaleFactor = 2.8; // px/mm
    let totalDist = 0.0;
    let isRunning = false;
    let isPaused = false;

    // 速度平滑化バッファ（移動平均用）
    let speedSamples = [];
    let lastSpeedUpdate = performance.now();
    let displaySpeed = 0.0;

    // パフォーマンス計測
    let lastTime = performance.now();
    let frameCnt = 0;
    let lastFpsTime = performance.now();

    // DOM
    const video = document.getElementById('v-elem');
    const calcCanvas = document.getElementById('calc-canvas');
    const calcCtx = calcCanvas.getContext('2d', { willReadFrequently: true });
    const overlayCanvas = document.getElementById('overlay-canvas');
    const overlayCtx = overlayCanvas.getContext('2d');

    const txtDist = document.getElementById('txt-dist');
    const txtSpeed = document.getElementById('txt-speed');
    const txtFps = document.getElementById('fps');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const btnTogglePause = document.getElementById('btn-toggle-pause');

    let prevCableProfile = null;
    let prevBgProfile = null;

    // --- カメラ起動 ---
    document.getElementById('btn-cam').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } },
          audio: false
        });
        video.srcObject = stream;
        video.play();
        isPaused = false;
        btnTogglePause.className = 'pause';
        btnTogglePause.innerText = '一時停止 ⏸';
        start();
      } catch (e) {
        alert('カメラ起動エラー: ' + e.message);
      }
    });

    // --- 動画ファイル読込 ---
    document.getElementById('file-video').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      video.srcObject = null;
      video.src = URL.createObjectURL(file);
      video.play();
      isPaused = false;
      btnTogglePause.className = 'pause';
      btnTogglePause.innerText = '一時停止 ⏸';
      start();
    });

    // --- 一時停止 / 再開ボタン ---
    btnTogglePause.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        btnTogglePause.className = 'resume';
        btnTogglePause.innerText = '測定再開 ▶';
        statusDot.className = 'status-dot paused';
        statusText.innerText = '測定一時停止中';
        txtSpeed.innerText = "0.0";
      } else {
        btnTogglePause.className = 'pause';
        btnTogglePause.innerText = '一時停止 ⏸';
        prevCableProfile = null;
        prevBgProfile = null;
      }
    });

    // --- 手動加減算 (+0.1m / -0.1m) ---
    document.getElementById('btn-plus').addEventListener('click', () => {
      totalDist += 0.1;
      updateDistDisplay();
    });
    document.getElementById('btn-minus').addEventListener('click', () => {
      totalDist = Math.max(0, totalDist - 0.1);
      updateDistDisplay();
    });

    // --- 数値直接入力（ボタンおよびカードタップ） ---
    function promptManualDistance() {
      const current = totalDist.toFixed(2);
      const val = prompt('現在の延線距離(m)を直接入力してください:', current);
      if (val !== null && !isNaN(parseFloat(val))) {
        totalDist = Math.max(0, parseFloat(val));
        updateDistDisplay();
      }
    }
    document.getElementById('btn-direct-input').addEventListener('click', promptManualDistance);
    document.getElementById('card-dist').addEventListener('click', promptManualDistance);

    // --- 0mリセット ---
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('測定距離を 0.00m にリセットしますか？')) {
        totalDist = 0.0;
        speedSamples = [];
        displaySpeed = 0.0;
        updateDistDisplay();
        txtSpeed.innerText = "0.0";
      }
    });

    function updateDistDisplay() {
      txtDist.innerText = totalDist.toFixed(2);
    }

    function start() {
      if (isRunning) return;
      isRunning = true;
      requestAnimationFrame(mainLoop);
    }

    // --- メイン解析ループ ---
    function mainLoop(now) {
      if (!isRunning) return;

      if (video.readyState >= 2) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        if (overlayCanvas.width !== overlayCanvas.clientWidth) {
          overlayCanvas.width = overlayCanvas.clientWidth;
          overlayCanvas.height = overlayCanvas.clientHeight;
        }

        const procW = 320;
        const procH = Math.floor(vh * (procW / vw));
        if (calcCanvas.width !== procW) {
          calcCanvas.width = procW;
          calcCanvas.height = procH;
        }

        calcCtx.drawImage(video, 0, 0, procW, procH);

        // ケーブル帯（中央40%〜60%）
        const cableY = Math.floor(procH * 0.4);
        const cableH = Math.max(8, Math.floor(procH * 0.2));
        const cableImg = calcCtx.getImageData(0, cableY, procW, cableH);

        // 背景帯（上部8%〜18%：手ブレ検出用）
        const bgY = Math.floor(procH * 0.08);
        const bgH = Math.max(8, Math.floor(procH * 0.1));
        const bgImg = calcCtx.getImageData(0, bgY, procW, bgH);

        const halation = detectHalation(cableImg.data);
        const currCableProf = getProfile(cableImg.data, procW, cableH, true);
        const currBgProf = getProfile(bgImg.data, procW, bgH, false);

        if (!isPaused && prevCableProfile && prevBgProfile) {
          const shiftCable = calcShift(prevCableProfile, currCableProf);
          const shiftBg = calcShift(prevBgProfile, currBgProf);

          // === 手持ち暴走防止フィルター ===
          // 1. 背景の揺れが過大な場合（急な手のあおり）はコマを捨てる
          const isJitterTooHigh = Math.abs(shiftBg) > 8; 

          // 2. 背景とケーブルが全く同じ方向に動いている場合（手持ちカメラ自体の並進移動）をカット
          let pureShiftPx = 0;
          if (!isJitterTooHigh) {
            pureShiftPx = (shiftCable - shiftBg) * (vw / procW);
          }

          // 3. デッドゾーン（微小な手震えノイズ 0.5mm未満 を切り捨て）
          const dMeter = (pureShiftPx / scaleFactor) / 1000.0;
          const dt = (now - lastTime) / 1000.0;

          // 4. 速度異常値カット（分速 30m/min ≒ 秒速0.5mを超える急激なジャンプは除外）
          const maxAllowedShiftPerFrame = 0.04; // 1フレームあたり4cm以上の瞬間移動はノイズ判定
          if (!isJitterTooHigh && Math.abs(dMeter) < maxAllowedShiftPerFrame && Math.abs(dMeter) > 0.0005) {
            totalDist += dMeter;
            updateDistDisplay();

            if (dt > 0 && dt < 0.2) {
              const instantSpeed = (dMeter / dt) * 60.0;
              speedSamples.push(Math.max(0, instantSpeed));
            }
          } else if (Math.abs(dMeter) <= 0.0005) {
            speedSamples.push(0);
          }

          // === 速度表示の平滑化（0.5秒周期で平均値更新） ===
          if (now - lastSpeedUpdate > 500) {
            if (speedSamples.length > 0) {
              const sum = speedSamples.reduce((a, b) => a + b, 0);
              displaySpeed = sum / speedSamples.length;
              speedSamples = [];
            } else {
              displaySpeed = 0.0;
            }
            txtSpeed.innerText = displaySpeed.toFixed(1);
            lastSpeedUpdate = now;
          }

          updateStatus(halation, isJitterTooHigh);
        }

        prevCableProfile = currCableProf;
        prevBgProfile = currBgProf;

        renderGuides(overlayCanvas.width, overlayCanvas.height);

        // FPS
        frameCnt++;
        if (now -
