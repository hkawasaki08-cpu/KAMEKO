<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100dvh;
      background: #09090b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    header {
      background: #18181b;
      padding: 4px 10px;
      height: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
      z-index: 30;
    }
    .title { font-size: 12px; font-weight: bold; color: #4ade80; }
    #status-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: #475569; color: #fff; font-weight: bold;
    }
    #status-badge.active { background: #16a34a; }
    #status-badge.cal1 { background: #d97706; }
    #status-badge.cal2 { background: #0284c7; }

    #dash-container {
      background: #111827;
      padding: 6px 6px;
      border-bottom: 1px solid #1f2937;
      flex-shrink: 0;
      z-index: 25;
    }
    #dash { display: flex; gap: 4px; }
    .card {
      flex: 1; background: #000;
      border: 1px solid #374151; border-radius: 6px;
      padding: 10px 4px; text-align: center;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .card-lbl { font-size: 11px; color: #9ca3af; font-weight: bold; margin-bottom: 2px; }
    .card-val { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .card-unit { font-size: 11px; color: #9ca3af; margin-left: 2px; }
    .card-sub { font-size: 9px; color: #38bdf8; font-weight: bold; margin-top: 3px; }

    #control-subbar {
      background: #18181b;
      padding: 3px 6px;
      display: flex;
      gap: 6px;
      align-items: stretch;
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
    }
    .mode-tab {
      flex: 1; background: #1e293b; border: 1px solid #475569; color: #94a3b8;
      padding: 0; border-radius: 4px; font-size: 11px; font-weight: 900;
      cursor: pointer; text-align: center;
      height: 17px; min-height: 17px; line-height: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .mode-tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    #btn-dir {
      flex: 0 0 54px;
      font-size: 12px;
      font-weight: 900;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 17px; min-height: 17px; line-height: 15px;
      padding: 0;
    }
    #btn-dir.dir-auto { background: #334155; border: 1px solid #64748b; color: #38bdf8; }
    #btn-dir.dir-fwd { background: #0d9488; border: 1.5px solid #2dd4bf; color: #fff; }
    #btn-dir.dir-rev { background: #ea580c; border: 1.5px solid #fb923c; color: #fff; }

    #stage {
      position: relative;
      flex: 1;
      min-height: 75px;
      max-height: 155px;
      width: 100%;
      background: #000;
      overflow: hidden;
      border-bottom: 1px solid #334155;
    }
    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; /* 黒帯を排除して画面幅いっぱいに拡大充填 */
      object-position: center center;
      background: #000;
      transform-origin: center center;
    }
    #target-box {
      position: absolute;
      top: 10%; left: 3%; width: 94%; height: 80%;
      border: 2px solid #22c55e; border-radius: 6px;
      box-shadow: inset 0 0 8px rgba(34, 197, 94, 0.4);
      z-index: 10; pointer-events: none;
    }
    #target-center-line {
      position: absolute;
      top: 0; left: 50%; width: 1px; height: 100%;
      border-left: 1px dashed rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }
    #error-banner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(37, 99, 235, 0.95); border: 2px solid #93c5fd;
      color: #fff; padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: bold; z-index: 35;
      display: none; white-space: nowrap;
    }

    #diag-panel {
      background: #0b1329;
      border-bottom: 1px solid #1e293b;
      padding: 3px 6px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    #diag-info { flex: 1; display: flex; flex-direction: column; gap: 1px; }
    #diag-msg { font-size: 10px; font-weight: bold; color: #4ade80; }
    #diag-sub { font-size: 8px; color: #94a3b8; font-variant-numeric: tabular-nums; }
    #diag-canvas {
      width: 80px; height: 16px; border: 1px solid #334155;
      border-radius: 2px; background: #000; display: block;
    }

    #rec-controls-bar {
      background: #18181b;
      padding: 4px 6px;
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
    }
    #b-reload {
      background: #334155; color: #fff; border: 1.5px solid #475569;
      padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: bold;
      cursor: pointer; height: 34px; min-height: 34px;
      display: flex; align-items: center; justify-content: center;
    }
    .rec-btn {
      flex: 0 0 28%;
      background: #b91c1c; color: #fff; border: 1.5px solid #ef4444;
      padding: 0; border-radius: 6px; font-size: 12px; font-weight: 900;
      cursor: pointer; text-align: center; line-height: 1;
      height: 34px; min-height: 34px;
      display: flex; align-items: center; justify-content: center;
    }
    #rec-timer {
      font-size: 11px; font-weight: bold; color: #ef4444;
      background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px;
      display: none; white-space: nowrap; margin-right: auto;
    }

    #v-bar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 4px 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .v-row { display: flex; gap: 5px; align-items: center; }

    .align-slider-row {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #1e293b;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      color: #38bdf8;
      font-weight: bold;
    }
    .align-slider-row input[type="range"] {
      flex: 1;
      height: 5px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    
    .v-btn {
      flex: 1; background: #1e293b; color: #fff;
      border: 1px solid #475569; padding: 0; border-radius: 4px;
      font-size: 10px; font-weight: bold; text-align: center; cursor: pointer;
      line-height: 15px; height: 17px; min-height: 17px;
      display: flex; align-items: center; justify-content: center;
    }
    .v-btn.active { background: #9333ea; border-color: #c084fc; }

    #b-test-cal {
      background: #0369a1; border-color: #38bdf8; color: #fff;
    }
    #b-test-cal.calibrating {
      background: #dc2626 !important; border-color: #f87171 !important; animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.6; } }

    .spd-step-btn {
      flex: 0 0 58px;
      background: #1e293b; color: #38bdf8;
      border: 1.5px solid #0284c7; border-radius: 6px;
      font-size: 12px; font-weight: 900;
      cursor: pointer; text-align: center;
      line-height: 1; height: 34px; min-height: 34px;
      display: flex; align-items: center; justify-content: center;
    }
    .spd-step-btn:active { background: #0284c7; color: #fff; }
    
    #txt-spd-val {
      flex: 1; background: #000; color: #4ade80;
      border: 1.5px solid #334155; border-radius: 6px;
      font-size: 13px; font-weight: 900;
      text-align: center; cursor: pointer;
      font-variant-numeric: tabular-nums; line-height: 1;
      height: 34px; min-height: 34px;
      display: flex; align-items: center; justify-content: center;
    }

    footer {
      background: #18181b;
      padding: 4px 6px calc(6px + env(safe-area-inset-bottom, 2px));
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid #27272a;
      flex-shrink: 0;
      z-index: 40;
    }
    
    .btn-row-top { display: flex; gap: 5px; align-items: stretch; }
    .btn-row-bottom { display: flex; gap: 5px; align-items: stretch; }
    
    button, label.btn {
      background: #27272a; color: #fff;
      border: 1.5px solid #3f3f46; border-radius: 6px;
      font-size: 12px; font-weight: bold; text-align: center;
      cursor: pointer; touch-action: manipulation;
      display: flex; justify-content: center; align-items: center;
      min-height: 58px; padding: 0 4px;
    }
    button.green { background: #16a34a; border-color: #22c55e; }
    button.orange { background: #d97706; border-color: #f59e0b; }
    button.purple { background: #7c3aed; border-color: #a855f7; }
    button.mic-on { background: #dc2626 !important; border-color: #ef4444 !important; }
    input[type="file"] { display: none; }

    .col-left-main { flex: 1.3 !important; min-height: 58px; }
    .col-center-wide { flex: 1.6 !important; min-height: 58px; }
    .col-right-fixed { flex: 0 0 68px !important; min-height: 58px; padding: 0 !important; }

    #b-pause { font-size: 15px; font-weight: 900; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.4); }
    #b-zero { font-size: 14px; font-weight: 900; color: #f87171; }
    #b-manual-start { font-size: 13px; font-weight: 900; line-height: 1.3; }
    #b-set-target { font-size: 16px; font-weight: 900; letter-spacing: 0.5px; }
    #b-mic { font-size: 11px; flex-direction: column; gap: 2px; }
    #btn-video-label { font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="title">KAMEKO 距離計 (試作検証版)</div>
    <div id="status-badge">手動待機中</div>
  </header>

  <div id="dash-container">
    <div id="dash">
      <div class="card">
        <div class="card-lbl">延線距離</div>
        <div><span id="txt-dist" class="card-val">0.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card" style="border-color: #0284c7;">
        <div class="card-lbl">残距離 (<span id="txt-target-val">31</span>m)</div>
        <div><span id="txt-remain" class="card-val" style="color: #38bdf8;">31.00</span><span class="card-unit">m</span></div>
        <div class="card-sub" id="txt-eta">予想: --分--秒</div>
      </div>
      <div class="card">
        <div class="card-lbl">速度</div>
        <div><span id="txt-speed" class="card-val">0.0</span><span class="card-unit">m/分</span></div>
      </div>
    </div>
  </div>

  <div id="control-subbar">
    <button class="dir-fwd" id="btn-dir" title="タップで延線方向切替">➡</button>
    <button class="mode-tab active" id="tab-manual">✋ 手動</button>
    <button class="mode-tab" id="tab-auto">🎯 自動</button>
  </div>

  <div id="stage">
    <video id="v" playsinline webkit-playsinline muted loop preload="metadata"></video>
    <canvas id="c-proc" style="display:none;"></canvas>
    <div id="target-box">
      <div id="target-center-line"></div>
    </div>
    <div id="error-banner">🔄 バック中...</div>
  </div>

  <div id="diag-panel">
    <div id="diag-info">
      <span id="diag-msg">🔍 カメラ起動中...</span>
      <span id="diag-sub">光量・エッジを診断</span>
    </div>
    <canvas id="diag-canvas" width="160" height="32"></canvas>
  </div>

  <div id="rec-controls-bar">
    <span id="rec-timer">● REC 00:00</span>
    <button id="b-reload" title="ページを再読み込み">🔄 リロード</button>
    <button id="b-rec-start" class="rec-btn">🔴 録画</button>
    <button id="b-rec-stop" class="rec-btn" style="display:none; background:#dc2626;">⏹ 停止</button>
  </div>

  <div id="v-bar">
    <div class="align-slider-row">
      <span>↕ 位置:</span>
      <input type="range" id="sl-video-y" min="0" max="100" value="90">
      <span>🔍 拡大:</span>
      <input type="range" id="sl-video-zoom" min="100" max="350" value="100">
    </div>

    <div class="v-row">
      <span style="font-size: 10px; color: #38bdf8; min-width: 28px; font-weight: bold;">速度:</span>
      <button class="spd-step-btn" id="b-spd-down">➖ -0.5</button>
      <div id="txt-spd-val" title="タップで等速(1.0x)/停止(0.0x)切替">+1.0x</div>
      <button class="spd-step-btn" id="b-spd-up">➕ +0.5</button>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:9px; color:#94a3b8; margin: 2px 0 1px 0;">
      <span>🎬 コントローラー</span>
      <span id="v-time">0.0s</span>
    </div>
    <div class="v-row">
      <button class="v-btn" id="vb-b1">-0.1秒</button>
      <button class="v-btn" id="vb-rev">◀ 逆転</button>
      <button class="v-btn" id="vb-play" style="background:#0284c7;">一時停止 ⏸</button>
      <button class="v-btn" id="vb-f1">+0.1秒</button>
      <button class="v-btn" id="b-test-cal" title="1つ目の黄色テープで押下、2つ目で再度押下">📐 2m校正/検証</button>
    </div>
  </div>

  <footer>
    <div class="btn-row-top">
      <button id="b-pause" class="green col-left-main">測定開始 ▶</button>
      <button id="b-manual-start" class="purple col-center-wide">▶ 手動スタート</button>
      <button id="b-mic" class="col-right-fixed" style="background:#2563eb;">🎤<br>音声</button>
    </div>
    <div class="btn-row-bottom">
      <button id="b-zero" class="col-left-main" style="background:#334155;">0mリセット</button>
      <button id="b-set-target" class="col-center-wide" style="background:#334155;">目標m</button>
      <label class="btn col-right-fixed" id="btn-video-label" for="f-video" style="background:#1e293b; border-color:#475569;">動画</label>
      <input type="file" id="f-video" accept="video/*">
    </div>
  </footer>

  <script>
    var operationMode = 'MANUAL';
    var scaleFactor = 2.675;

    var moveDirection = 1;
    var autoDirAccumPx = 0.0;

    var totalDist = 0.0;
    var targetDist = 31.0;
    var isRunning = false;
    var isPaused = true;
    var isManualTracking = false;

    var isFileVideoMode = false;
    var currentPlaybackRate = 1.0;

    var videoAlignY = 0.90;
    var videoZoomScale = 1.0;

    var autoState = 'WAIT_HEAD_INSIDE';
    var isInsideYellow = false;
    var totalPxSinceStart = 0.0;
    var whiteFrameCount = 0;

    var baseCableThickPx = 0.0;
    var curCableThickPx = 0.0;
    var thickHistory = [];

    var lastShiftS = 0;

    var testCalActive = false;
    var testCalStartPx = 0.0;
    var bTestCal = document.getElementById('b-test-cal');

    var announcedMarks = {};
    var speedSamples = [];
    var lastSpeedTime = performance.now();
    var currentSpeed = 0.0;
    var lastProcessTime = 0;
    var lastDiagTime = 0;
    var reverseInterval = null;
    var isReversing = false;
    var backwardStreak = 0;

    var isCameraOpening = false;
    var cameraPermissionTimeout = null;

    var wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', function() { wakeLock = null; });
        }
      } catch (err) {
        console.warn('Wake Lock request failed:', err);
      }
    }

    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible' && (!isPaused || isRunning)) {
        await requestWakeLock();
      }
    });

    document.getElementById('b-reload').addEventListener('click', function() {
      if (confirm('画面を再読み込みしますか？')) location.reload();
    });

    var PW = 200, PH = 32;
    var rawProf = new Float32Array(PW);
    var curProf = new Float32Array(PW);
    var prevProf = new Float32Array(PW);
    var hasPrevProf = false;

    var stage = document.getElementById('stage');
    var targetBox = document.getElementById('target-box');
    var v = document.getElementById('v');
    var cProc = document.getElementById('c-proc');
    cProc.width = PW; cProc.height = PH;
    var ctxProc = cProc.getContext('2d', { willReadFrequently: true, alpha: false });

    var slVideoY = document.getElementById('sl-video-y');
    var slVideoZoom = document.getElementById('sl-video-zoom');

    function applyVideoTransform() {
      if (isFileVideoMode) {
        v.style.objectFit = 'cover';
        v.style.objectPosition = 'center ' + (videoAlignY * 100).toFixed(1) + '%';
        v.style.transform = 'scale(' + videoZoomScale.toFixed(2) + ')';
      } else {
        // カメラ起動時：全幅充填（黒帯解消）
        v.style.objectFit = 'cover';
        v.style.objectPosition = 'center center';
        v.style.transform = 'none';
      }
    }

    slVideoY.addEventListener('input', function() {
      videoAlignY = parseFloat(this.value) / 100.0;
      applyVideoTransform();
    });

    slVideoZoom.addEventListener('input', function() {
      videoZoomScale = parseFloat(this.value) / 100.0;
      applyVideoTransform();
    });

    var diagMsg = document.getElementById('diag-msg');
    var diagSub = document.getElementById('diag-sub');
    var diagCanvas = document.getElementById('diag-canvas');
    var ctxDiag = diagCanvas.getContext('2d', { alpha: false });
    var diagImgData = ctxDiag.createImageData(160, 32);

    var txtDist = document.getElementById('txt-dist');
    var txtRemain = document.getElementById('txt-remain');
    var txtTargetVal = document.getElementById('txt-target-val');
    var txtSpeed = document.getElementById('txt-speed');
    var txtEta = document.getElementById('txt-eta');
    var vBar = document.getElementById('v-bar');
    var vTime = document.getElementById('v-time');
    var bPause = document.getElementById('b-pause');
    var statusBadge = document.getElementById('status-badge');
    var errorBanner = document.getElementById('error-banner');
    var bManualStart = document.getElementById('b-manual-start');
    var btnDir = document.getElementById('btn-dir');
    var vbPlay = document.getElementById('vb-play');
    var vbRev = document.getElementById('vb-rev');
    var bMic = document.getElementById('b-mic');

    var bSpdDown = document.getElementById('b-spd-down');
    var bSpdUp = document.getElementById('b-spd-up');
    var txtSpdVal = document.getElementById('txt-spd-val');

    bTestCal.addEventListener('click', function() {
      if (!testCalActive) {
        testCalActive = true;
        testCalStartPx = totalPxSinceStart;
        bTestCal.classList.add('calibrating');
        bTestCal.innerText = '⏹ 2枚目で確定';
        speak('1つ目のテープを記録しました。2つ目のテープで再度押してください。', 1);
      } else {
        testCalActive = false;
        bTestCal.classList.remove('calibrating');
        bTestCal.innerText = '📐 2m校正/検証';

        var diffPx = Math.abs(totalPxSinceStart - testCalStartPx);
        var currentMeasuredM = (diffPx / scaleFactor) / 1000.0;
        var optimalScale = diffPx / 2000.0;

        var errPct = ((currentMeasuredM - 2.0) / 2.0) * 100.0;
        var msg = "【2m区間 精度検証結果】\n" +
                  "・通過ピクセル数: " + diffPx.toFixed(1) + " px\n" +
                  "・現状設定での測定値: " + currentMeasuredM.toFixed(2) + " m\n" +
                  "・測定誤差: " + (errPct >= 0 ? "+" : "") + errPct.toFixed(1) + " %\n\n" +
                  "この動画の最適スケール値は 【" + optimalScale.toFixed(4) + "】 です。\n" +
                  "この値を新しい基準値として適用しますか？";

        if (confirm(msg)) {
          scaleFactor = optimalScale;
          speak('新しいスケール値を適用しました。', 1);
        }
      }
    });

    btnDir.addEventListener('click', function() {
      if (moveDirection === 1) setDirection(-1, true);
      else setDirection(1, true);
    });

    function setDirection(dir, isManual) {
      moveDirection = dir;
      if (moveDirection === 1) {
        btnDir.innerText = '➡'; btnDir.className = 'dir-fwd'; speak('右向きに設定しました', 1);
      } else if (moveDirection === -1) {
        btnDir.innerText = '⬅'; btnDir.className = 'dir-rev'; speak('左向きに設定しました', 1);
      } else {
        btnDir.innerText = '🔄'; btnDir.className = 'dir-auto';
      }
      backwardStreak = 0;
      errorBanner.style.display = 'none';
      hasPrevProf = false;
      lastShiftS = 0;
    }

    function speak(text, count) {
      if (!('speechSynthesis' in window)) return;
      var times = count || 1;
      for (var i = 0; i < times; i++) {
        var uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP'; uttr.rate = 1.15;
        window.speechSynthesis.speak(uttr);
      }
    }

    function checkDistanceAnnouncements(currentD) {
      var diff = targetDist - currentD;
      if (diff > 10.5) {
        var step5 = Math.floor(currentD / 5.0) * 5;
        if (step5 >= 5 && (currentD - step5) < 0.8 && !announcedMarks['fwd_' + step5]) {
          announcedMarks['fwd_' + step5] = true; speak(step5 + 'メートル', 1);
        }
      }
      for (var m = 10; m >= 1; m--) {
        if (diff <= m && !announcedMarks['rem_' + m]) {
          announcedMarks['rem_' + m] = true; speak(m + 'メートル', 1); return;
        }
      }
      if (diff <= 0.05 && diff >= -0.3 && !announcedMarks['zero']) {
        announcedMarks['zero'] = true; speak('ゼロ、到達しました', 1); return;
      }
      if (diff < 0) {
        var overM = Math.floor(Math.abs(diff));
        if (overM >= 1 && overM <= 25 && !announcedMarks['over_' + overM]) {
          announcedMarks['over_' + overM] = true; speak('プラス ' + overM + 'メートル', 1);
        }
      }
    }

    function startLoop() {
      if (isRunning) return;
      isRunning = true;
      requestAnimationFrame(mainLoop);
    }

    function runDiagnostics(avgLum, glareCount, whiteRatioPct, yellowRatioPct, now) {
      if (now - lastDiagTime < 1000) return;
      lastDiagTime = now;

      var sumEdge = 0;
      for (var x = 0; x < PW; x++) { sumEdge += Math.abs(curProf[x]); }
      var avgEdge = sumEdge / PW;

      if (avgLum < 20) {
        diagMsg.innerText = "❌ 光量不足（暗すぎます）"; diagMsg.style.color = "#ef4444";
      } else if (avgLum > 240) {
        diagMsg.innerText = "❌ 光量過多（白飛び）"; diagMsg.style.color = "#ef4444";
      } else {
        diagMsg.innerText = "🟢 測定環境：良好 (高感度解析中)"; diagMsg.style.color = "#4ade80";
      }

      var thickInfo = (baseCableThickPx > 0) ? (" | 太さ比:" + (curCableThickPx / baseCableThickPx).toFixed(2)) : "";
      diagSub.innerText = "W:" + whiteRatioPct.toFixed(0) + "% | Y:" + yellowRatioPct.toFixed(0) + "% | 特徴強度:" + avgEdge.toFixed(1) + thickInfo;

      var dData = diagImgData.data;
      var dw = 160, dh = 32;
      for (var dx = 0; dx < dw; dx++) {
        var srcX = Math.floor(dx * (PW / dw));
        var val = Math.min(255, Math.floor(Math.abs(curProf[srcX]) * 2.5));
        for (var dy = 0; dy < dh; dy++) {
          var pIdx = (dy * dw + dx) * 4;
          dData[pIdx] = val; dData[pIdx+1] = val; dData[pIdx+2] = val; dData[pIdx+3] = 255;
        }
      }
      ctxDiag.putImageData(diagImgData, 0, 0);
    }

    function estimateCableThickness(imgData) {
      var rowLum = new Float32Array(PH);
      for (var y = 0; y < PH; y++) {
        var rowSum = 0;
        for (var x = 20; x < PW - 20; x++) {
          var idx = (y * PW + x) * 4;
          rowSum += (0.299 * imgData[idx] + 0.587 * imgData[idx+1] + 0.114 * imgData[idx+2]);
        }
        rowLum[y] = rowSum / (PW - 40);
      }

      var maxGrad = -1, topY = 0;
      var minGrad = 1, botY = PH - 1;

      for (var y = 1; y < PH - 1; y++) {
        var grad = rowLum[y+1] - rowLum[y-1];
        if (grad > maxGrad) { maxGrad = grad; topY = y; }
        if (grad < minGrad) { minGrad = grad; botY = y; }
      }

      var rawThick = Math.abs(botY - topY);
      if (rawThick >= 6.0 && rawThick <= 30.0) {
        thickHistory.push(rawThick);
        if (thickHistory.length > 5) thickHistory.shift();
        var sum = 0;
        for (var i = 0; i < thickHistory.length; i++) sum += thickHistory[i];
        return sum / thickHistory.length;
      }
      return curCableThickPx || 16.0;
    }

    function mainLoop(now) {
      // 15fps制御でメモリ蓄積を完全に防止
      if (now - lastProcessTime > 64) {
        var dtSec = (now - lastProcessTime) / 1000.0;
        lastProcessTime = now;

        var isVideoActive = (!v.paused || isReversing);

        if (v.readyState >= 2 && v.videoWidth > 0 && isVideoActive) {
          isPaused = false;

          var vw = v.videoWidth;
          var vh = v.videoHeight;

          var sRect = stage.getBoundingClientRect();
          var bRect = targetBox.getBoundingClientRect();

          var sx, sy, swSrc, shSrc;

          if (isFileVideoMode) {
            var baseScale = Math.max(sRect.width / vw, sRect.height / vh) * videoZoomScale;
            var rw = vw * baseScale;
            var rh = vh * baseScale;
            var ox = (sRect.width - rw) * 0.5;
            var oy = (sRect.height - rh) * videoAlignY;

            sx = Math.max(0, Math.floor((bRect.left - sRect.left - ox) / baseScale));
            sy = Math.max(0, Math.floor((bRect.top - sRect.top - oy) / baseScale));
            swSrc = Math.min(vw - sx, Math.floor(bRect.width / baseScale));
            shSrc = Math.min(vh - sy, Math.floor(bRect.height / baseScale));
          } else {
            // カメラ起動時：全幅充填（黒帯なし）幾何座標計算
            var scale = Math.max(sRect.width / vw, sRect.height / vh);
            var rw = vw * scale;
            var rh = vh * scale;
            var ox = (sRect.width - rw) / 2;
            var oy = (sRect.height - rh) / 2;

            sx = Math.max(0, Math.floor((bRect.left - sRect.left - ox) / scale));
            sy = Math.max(0, Math.floor((bRect.top - sRect.top - oy) / scale));
            swSrc = Math.min(vw - sx, Math.floor(bRect.width / scale));
            shSrc = Math.min(vh - sy, Math.floor(bRect.height / scale));
          }

          if (swSrc > 0 && shSrc > 0) {
            ctxProc.drawImage(v, sx, sy, swSrc, shSrc, 0, 0, PW, PH);
          }
          var imgData = ctxProc.getImageData(0, 0, PW, PH).data;

          curCableThickPx = estimateCableThickness(imgData);

          var whiteCountTotal = 0, yellowCountTotal = 0, glareCount = 0, sumLumTotal = 0;
          var minVal = 999, maxVal = -999;

          for (var x = 0; x < PW; x++) {
            var sumG = 0;
            for (var y = 0; y < PH; y++) {
              var idx = (y * PW + x) * 4;
              var r = imgData[idx], g = imgData[idx+1], b = imgData[idx+2];
              var lum = 0.299 * r + 0.587 * g + 0.114 * b;
              sumG += lum; sumLumTotal += lum;

              if (lum > 105 && Math.abs(r - g) < 45 && Math.abs(r - b) < 55) whiteCountTotal++;
              if (lum > 235) glareCount++;
              if (r > 105 && g > 95 && b < 125 && (r + g - 2 * b) > 45) yellowCountTotal++;
            }
            var colAvg = sumG / PH;
            rawProf[x] = colAvg;
            if (colAvg < minVal) minVal = colAvg;
            if (colAvg > maxVal) maxVal = colAvg;
          }

          var range = maxVal - minVal;
          if (range > 2.0) {
            for (var x = 0; x < PW; x++) {
              curProf[x] = ((rawProf[x] - minVal) / range) * 255.0;
            }
          } else {
            for (var x = 0; x < PW; x++) {
              curProf[x] = rawProf[x];
            }
          }

          var totalPixels = PW * PH;
          var whiteRatio = whiteCountTotal / totalPixels;
          var yellowRatio = yellowCountTotal / totalPixels;
          runDiagnostics(sumLumTotal / totalPixels, glareCount, whiteRatio * 100.0, yellowRatio * 100.0, now);

          if (operationMode === 'AUTO') {
            var isWhitePresent = whiteRatio > 0.08;
            var isYellowPresent = yellowRatio > 0.05;

            if (autoState === 'WAIT_HEAD_INSIDE') {
              if (isWhitePresent) {
                whiteFrameCount++;
                if (whiteFrameCount >= 2) {
                  autoState = 'WAIT_HEAD_TRAILING';
                  statusBadge.innerText = 'ヘッド通過中...';
                }
              } else { whiteFrameCount = 0; }
            } else if (autoState === 'WAIT_HEAD_TRAILING') {
              if (whiteRatio < 0.04) {
                autoState = 'TRACKING_WAIT_YEL1';
                totalDist = 0.0; totalPxSinceStart = 0.0;
                baseCableThickPx = curCableThickPx;
                statusBadge.className = 'active';
                statusBadge.innerText = '測定中 (1m黄待ち)';
                updateDistUI();
                speak('ヘッド通過、測定を開始します。', 2);
              }
            } else if (autoState === 'TRACKING_WAIT_YEL1') {
              if (isYellowPresent) {
                isInsideYellow = true;
              } else if (isInsideYellow && yellowRatio < 0.03 && totalPxSinceStart > 450) {
                isInsideYellow = false;
                autoState = 'TRACKING_WAIT_YEL2';
                scaleFactor = totalPxSinceStart / 1000.0;
                baseCableThickPx = curCableThickPx;
                totalDist = 1.0;
                statusBadge.className = 'cal1';
                statusBadge.innerText = '1次校正済 (1.00m / 2m黄待ち)';
                speak('1メートル通過、1次校正完了', 1);
              }
            } else if (autoState === 'TRACKING_WAIT_YEL2') {
              if (isYellowPresent) {
                isInsideYellow = true;
              } else if (isInsideYellow && yellowRatio < 0.03 && totalPxSinceStart > (scaleFactor * 1500)) {
                isInsideYellow = false;
                autoState = 'TRACKING_FINAL';
                scaleFactor = totalPxSinceStart / 2000.0;
                baseCableThickPx = curCableThickPx;
                totalDist = 2.0;
                statusBadge.className = 'cal2';
                statusBadge.innerText = '本校正完了 (2.00m / 最高精度)';
                speak('2メートル通過、本校正完了しました', 1);
              }
            }
          }

          var canTrack = (operationMode === 'MANUAL' && isManualTracking) ||
                         (operationMode === 'AUTO' && autoState !== 'WAIT_HEAD_INSIDE' && autoState !== 'WAIT_HEAD_TRAILING');

          if (canTrack && hasPrevProf) {
            var centerS = Math.round(lastShiftS * 0.7);
            centerS = Math.max(-30, Math.min(30, centerS));

            var halfWin = 45;
            var minS = Math.max(-70, centerS - halfWin);
            var maxS = Math.min(70, centerS + halfWin);

            var bestS = centerS, minDiff = 99999999;
            var margin = 72;

            for (var s = minS; s <= maxS; s++) {
              var diff = 0;
              for (var i = margin; i < PW - margin; i++) {
                diff += Math.abs(prevProf[i] - curProf[i + s]);
              }
              if (diff < minDiff) { minDiff = diff; bestS = s; }
            }

            lastShiftS = bestS;

            var rawShiftPx = bestS * (swSrc / PW);
            var activeDir = (moveDirection !== 0) ? moveDirection : 1;
            var shiftPx = rawShiftPx * activeDir;

            if (baseCableThickPx > 4.0 && curCableThickPx > 4.0) {
              var thickRatio = baseCableThickPx / curCableThickPx;
              if (thickRatio >= 0.5 && thickRatio <= 2.0) {
                shiftPx *= thickRatio;
              }
            }

            if (shiftPx < -2.0) {
              backwardStreak++;
              if (backwardStreak >= 3) {
                errorBanner.innerText = '🔄 バック中...';
                errorBanner.style.display = 'block';
              }
            } else {
              backwardStreak = 0;
              errorBanner.style.display = 'none';
            }

            if (Math.abs(shiftPx) > 0.001) {
              var deltaM = (shiftPx / scaleFactor) / 1000.0;
              totalDist += deltaM;
              totalPxSinceStart += shiftPx;
              updateDistUI();
              checkDistanceAnnouncements(totalDist);

              if (dtSec > 0 && dtSec < 0.25) {
                speedSamples.push((Math.abs(deltaM) / dtSec) * 60.0);
              }
            }

            if (now - lastSpeedTime > 500) {
              if (speedSamples.length > 0) {
                var avg = speedSamples.reduce(function(a, b){ return a + b; }, 0) / speedSamples.length;
                currentSpeed = currentSpeed * 0.3 + avg * 0.7;
                speedSamples = [];
              } else { currentSpeed = 0.0; }
              txtSpeed.innerText = Math.max(0, currentSpeed).toFixed(1);
              updateDistUI();
              lastSpeedTime = now;
            }
          } else {
            txtSpeed.innerText = "0.0";
            lastShiftS = 0;
          }

          prevProf.set(curProf);
          hasPrevProf = true;
        } else if (v.paused && !isReversing) {
          txtSpeed.innerText = "0.0";
          txtEta.innerText = "予想: --分--秒";
          backwardStreak = 0;
          errorBanner.style.display = 'none';
          hasPrevProf = false;
          lastShiftS = 0;
        }
      }

      requestAnimationFrame(mainLoop);
    }

    (function() {
      var mediaRecorder = null;
      var recordedChunks = [];
      var recTimerInterval = null;
      var recSec = 0;

      var bRecStart = document.getElementById('b-rec-start');
      var bRecStop = document.getElementById('b-rec-stop');
      var txtRecTimer = document.getElementById('rec-timer');

      function getSupportedMimeType() {
        var types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
        for (var i = 0; i < types.length; i++) {
          if (MediaRecorder.isTypeSupported(types[i])) return types[i];
        }
        return '';
      }

      bRecStart.addEventListener('click', function() {
        if (!v.srcObject) return alert('カメラが起動していません');
        if (typeof MediaRecorder === 'undefined') return alert('録画非対応です');

        try {
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(v.srcObject, { mimeType: getSupportedMimeType() });
        } catch(e) { return alert('録画初期化エラー: ' + e.message); }

        mediaRecorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = function() {
          cleanupRecUI();
          var blob = new Blob(recordedChunks, { type: 'video/mp4' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = 'kameko_rec_' + Date.now() + '.mp4';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(url); recordedChunks = []; mediaRecorder = null; }, 1500);
        };

        mediaRecorder.start(1000);
        bRecStart.style.display = 'none';
        bRecStop.style.display = 'flex';
        txtRecTimer.style.display = 'block';
        recSec = 0;
        
        recTimerInterval = setInterval(function() {
          recSec++;
          var m = Math.floor(recSec / 60); var s = recSec % 60;
          txtRecTimer.innerText = '● REC ' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }, 1000);
      });

      bRecStop.addEventListener('click', function() {
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      });

      function cleanupRecUI() {
        if (recTimerInterval) { clearInterval(recTimerInterval); recTimerInterval = null; }
        bRecStart.style.display = 'flex';
        bRecStop.style.display = 'none';
        txtRecTimer.style.display = 'none';
      }
    })();

    window.addEventListener('DOMContentLoaded', function() {
      openCamera();
    });

    window.addEventListener('touchstart', function() {
      requestWakeLock();
      if (!v.srcObject && !v.src && !isCameraOpening) {
        openCamera();
      }
    }, { once: true, passive: true });
  </script>
</body>
</html>
