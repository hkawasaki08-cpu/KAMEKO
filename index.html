<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #fps { font-size: 11px; color: #aaa; }

    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #111;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ケーブル測定枠（画面下部60%の通過帯に常時表示） */
    #target-box {
      position: absolute;
      top: 60%;
      left: 4%;
      width: 92%;
      height: 90px;
      border: 2px solid #22c55e;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      padding: 4px;
    }
    .box-tag {
      font-size: 10px;
      color: #22c55e;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 2px;
    }

    /* ダッシュボード */
    #dash {
      position: absolute;
      top: 8px;
      left: 6px;
      right: 6px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .card {
      flex: 1;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
    }
    .card-lbl { font-size: 9px; color: #aaa; }
    .card-val { font-size: 20px; font-weight: bold; }
    .card-unit { font-size: 10px; color: #888; margin-left: 1px; }

    /* モード切替 */
    #scale-selector {
      position: absolute;
      top: 68px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }

    /* 動画コントローラー */
    #v-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 8px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .v-row { display: flex; gap: 4px; align-items: center; }
    .v-btn {
      flex: 1;
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 0;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
    }
    .speed-btn {
      flex: 1;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 3px 0;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .speed-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }

    footer {
      background: #111;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 10px));
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .btn-row { display: flex; gap: 5px; }
    button, label.btn {
      flex: 1;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 9px 0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
    }
    button.green { background: #16a34a; border-color: #15803d; }
    button.orange { background: #d97706; border-color: #b45309; }
    button.mic-on { background: #b91c1c; border-color: #991b1b; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">(仮称)カメラ式ケーブル距離計</div>
    <div id="fps">0 FPS</div>
  </header>

  <div id="stage">
    <video id="v" playsinline webkit-playsinline muted autoplay loop></video>
    <canvas id="c-proc" style="display:none;"></canvas>

    <!-- ケーブル測定枠（常時表示） -->
    <div id="target-box">
      <span class="box-tag">🎯 ケーブル測定枠</span>
    </div>

    <!-- ダッシュボード -->
    <div id="dash">
      <div class="card">
        <div class="card-lbl">延線距離</div>
        <div><span id="txt-dist" class="card-val">0.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card" id="card-target" style="border-color: #38bdf8;">
        <div class="card-lbl">目標残 (目標: <span id="txt-target-val">31</span>m)</div>
        <div><span id="txt-remain" class="card-val" style="color: #38bdf8;">31.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card">
        <div class="card-lbl">速度 (平均)</div>
        <div><span id="txt-speed" class="card-val">0.0</span><span class="card-unit">m/分</span></div>
      </div>
    </div>

    <!-- モード切替 -->
    <div id="scale-selector">
      <button class="tab-btn active" id="tab-close">近接 (約40cm)</button>
      <button class="tab-btn" id="tab-wide">引き (約80cm〜1m)</button>
    </div>

    <!-- 動画操作バー -->
    <div id="v-bar">
      <div class="v-row" style="margin-bottom: 2px;">
        <span style="font-size: 10px; color: #38bdf8; min-width: 48px; font-weight: bold;">速度:</span>
        <button class="speed-btn" data-speed="0.25">0.25x</button>
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn active" data-speed="1.0">1.0x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="2.0">2.0x</button>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:#94a3b8;">
        <span>🎬 コントローラー</span>
        <span id="v-time">0.0s</span>
      </div>
