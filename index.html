<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #mic-status { font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
    .mic-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .mic-dot.active { background: #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    #stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    #dash {
      position: absolute;
      top: 8px;
      left: 6px;
      right: 6px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .card {
      flex: 1;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
    }
    .card-lbl { font-size: 9px; color: #aaa; }
    .card-val { font-size: 21px; font-weight: bold; font-variant-numeric: tabular-nums; }
    .card-unit { font-size: 10px; color: #888; margin-left: 1px; }

    #scale-selector {
      position: absolute;
      top: 72px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }

    #voice-toast {
      position: absolute;
      top: 106px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 11px;
      z-index: 25;
      display: none;
      white-space: nowrap;
    }

    #v-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 8px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .v-row { display: flex; gap: 4px; align-items: center; }
    .v-btn {
      flex: 1;
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 6px 0;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }

    footer {
      background: #111;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 10px));
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      z-index: 30;
    }
    .btn-row { display: flex; gap: 5px; }
    button, label.btn {
      flex: 1;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 9px 0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
    }
    button.green { background: #16a34a; border-color: #15803d; }
    button.orange { background: #d97706; border-color: #b45309; }
    button.mic-on { background: #b91c1c; border-color: #991b1b; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">(仮称)カメラ式ケーブル距離計</div>
    <div id="mic-status"><span id="mic-dot" class="mic-dot"></span><span id="mic-txt">音声: 切</span></div>
  </header>

  <div id="stage">
    <video id="v" playsinline webkit-playsinline muted autoplay loop></video>
    <canvas id="c-proc" style="display:none;"></canvas>
    <canvas id="overlay"></canvas>

    <div id="dash">
      <div class="card">
        <div class="card-lbl">延線距離</div>
        <div><span id="txt-dist" class="card-val">0.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card" id="card-target" style="border-color: #38bdf8;">
        <div class="card-lbl">目標残 (目標: <span id="txt-target-val">31</span>m)</div>
        <div><span id="txt-remain" class="card-val" style="color: #38bdf8;">31.00</span><span class="card-unit">m</span></div>
      </div>
      <div class="card">
        <div class="card-lbl">速度 (平均)</div>
        <div><span id="txt-speed" class="card-val">0.0</span><span class="card-unit">m/分</span></div>
      </div>
    </div>

    <div id="scale-selector">
      <button class="tab-btn active" id="tab-close">近接 (約40cm)</button>
      <button class="tab-btn" id="tab-wide">引き (約80cm〜1m)</button>
    </div>

    <div id="voice-toast">🎤 音声案内準備完了</div>

    <div id="v-bar">
      <div style="display:flex; justify-content:space-between; font-size:10px; color:#38bdf8;">
        <span>🎬 動画コントローラー</span>
        <span id="v-time">0.0s</span>
      </div>
      <div class="v-row">
        <button class="v-btn" id="vb-b1">-1秒</button>
        <button class="v-btn" id="vb-bstep">◀ コマ戻</button>
        <button class="v-btn" id="vb-play" style="background:#0284c7;">一時停止 ⏸</button>
        <button class="v-btn" id="vb-fstep">コマ送 ▶</button>
        <button class="v-btn" id="vb-f1">+1秒</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="btn-row">
      <button id="b-mic" style="background:#3b82f6;">🎤 音声認識 ON</button>
      <button id="b-set-target">目標mセット</button>
      <button id="b-m01">-0.1m</button>
      <button id="b-p01">+0.1m</button>
      <button id="b-zero" style="color:#f87171;">0mリセット</button>
    </div>
    <div class="btn-row">
      <button id="b-pause" class="orange">一時停止 ⏸</button>
      <button id="b-cam" class="green">カメラ起動</button>
      <label class="btn" for="f-video">動画読込</label>
      <input type="file" id="f-video" accept="video/*">
    </div>
  </footer>

  <script>
    var scaleFactor = 2.5;
    var totalDist = 0.0;
    var targetDist = 31.0;
    var isRunning = false;
    var isPaused = false;

    // 音声案内トリガーフラグ
    var announcedMarks = {};

    var speedSamples = [];
    var lastSpeedTime = performance.now();
    var currentSpeed = 0.0;
    var lastLoopTime = performance.now();
    var prevProfile = null;

    var v = document.getElementById('v');
    var cProc = document.getElementById('c-proc');
    var ctxProc = cProc.getContext('2d', { willReadFrequently: true });
    var overlay = document.getElementById('overlay');
    var ctxOverlay = overlay.getContext('2d');

    var txtDist = document.getElementById('txt-dist');
    var txtRemain = document.getElementById('txt-remain');
    var txtTargetVal = document.getElementById('txt-target-val');
    var txtSpeed = document.getElementById('txt-speed');
    var vBar = document.getElementById('v-bar');
    var vTime = document.getElementById('v-time');
    var bPause = document.getElementById('b-pause');
    var voiceToast = document.getElementById('voice-toast');

    // === 音声合成 ===
    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.15;
      window.speechSynthesis.speak(uttr);
      showToast('🔊 ' + text);
    }

    function showToast(text) {
      voiceToast.innerText = text;
      voiceToast.style.display = 'block';
      setTimeout(function() { voiceToast.style.display = 'none'; }, 2200);
    }

    // === 距離音声案内ロジック（5m刻み ＆ 残り10mカウントダウン ＆ 超過） ===
    function checkDistanceAnnouncements(currentD) {
      var diff = targetDist - currentD;

      // 1. スタート後 5m 刻み案内 (5m, 10m, 15m, 20m, 25m ...)
      // 残り10mを切る前（diff > 10.5m）の範囲で発声
      if (diff > 10.5) {
        var step5 = Math.floor(currentD / 5.0) * 5;
        if (step5 >= 5 && (currentD - step5) < 0.8 && !announcedMarks['fwd_' + step5]) {
          announcedMarks['fwd_' + step5] = true;
          speak(step5 + 'メートル');
          return;
        }
      }

      // 2. 残り10mから1mカウントダウン (10, 9, 8 ... 1m)
      for (var m = 10; m >= 1; m--) {
        if (diff <= m && !announcedMarks['rem_' + m]) {
          announcedMarks['rem_' + m] = true;
          speak(m + 'メートル');
          return;
        }
      }

      // 3. 0m 到達
      if (diff <= 0.05 && diff >= -0.3 && !announcedMarks['zero']) {
        announcedMarks['zero'] = true;
        speak('ゼロ、到達しました');
        return;
      }

      // 4. 超過加算 (+1m, +2m, +3m...)
      if (diff < 0) {
        var overM = Math.floor(Math.abs(diff));
        if (overM >= 1 && overM <= 15 && !announcedMarks['over_' + overM]) {
          announcedMarks['over_' + overM] = true;
          speak('プラス ' + overM + 'メートル');
        }
      }
    }

    // === 音声認識 ===
    var recognition = null;
    var isMicListening = false;
    var bMic = document.getElementById('b-mic');
    var micDot = document.getElementById('mic-dot');
    var micTxt = document.getElementById('mic-txt');

    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        var last = event.results.length - 1;
        var cmd = event.results[last][0].transcript.trim().replace(/\s+/g, '');
        showToast('🎤 認識: 「' + cmd + '」');
        handleVoiceCommand(cmd);
      };

      recognition.onerror = function() {
        if (isMicListening) { try { recognition.start(); } catch(err){} }
      };
      recognition.onend = function() {
        if (isMicListening) { try { recognition.start(); } catch(err){} }
      };
    }

    bMic.addEventListener('click', function() {
      if (!SpeechRecognition) {
        alert('お使いの環境は音声認識に対応していません');
        return;
      }
      isMicListening = !isMicListening;
      if (isMicListening) {
        try {
          recognition.start();
          bMic.className = 'mic-on';
          bMic.innerText = '🎤 音声認識 待受中';
          micDot.className = 'mic-dot active';
          micTxt.innerText = '音声: 待受中';
          speak('音声操作を開始します');
        } catch(e) {
          alert('マイク開始エラー: ' + e.message);
        }
      } else {
        recognition.stop();
        bMic.className = '';
        bMic.innerText = '🎤 音声認識 ON';
        micDot.className = 'mic-dot';
        micTxt.innerText = '音声: 切';
        speak('音声操作を終了しました');
      }
    });

    function handleVoiceCommand(cmd) {
      if (cmd.includes('スタート') || cmd.includes('開始') || cmd.includes('再開')) {
        if (isPaused) {
          isPaused = false;
          bPause.className = 'orange';
          bPause.innerText = '一時停止 ⏸';
          prevProfile = null;
        }
        speak('スタートしました');
      } else if (cmd.includes('ストップ') || cmd.includes('停止') || cmd.includes('止めて')) {
        isPaused = true;
        bPause.className = 'green';
        bPause.innerText = '測定再開 ▶';
        txtSpeed.innerText = "0.0";
        speak('ストップしました');
      } else if (cmd.includes('リセット') || cmd.includes('ゼロ')) {
        totalDist = 0.0;
        announcedMarks = {};
        updateDistUI();
        speak('ゼロリセットしました');
      } else if (cmd.includes('セット') || cmd.includes('目標')) {
        var num = extractNumber(cmd);
        if (num > 0) {
          targetDist = num;
          txtTargetVal.innerText = targetDist;
          announcedMarks = {};
          updateDistUI();
          speak(targetDist + 'メートルにセットしました');
        }
      }
    }

    function extractNumber(text) {
      var m = text.match(/\d+(\.\d+)?/);
      if (m) return parseFloat(m[0]);
      var kanji = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'二十':20,'三十':30,'三十一':31,'四十':40,'五十':50 };
      for (var k in kanji) {
        if (text.includes(k)) return kanji[k];
      }
      return 0;
    }

    document.getElementById('b-set-target').addEventListener('click', function() {
      var val = window.prompt("目標距離(m)を入力:", targetDist);
      if (val !== null && !isNaN(parseFloat(val))) {
        targetDist = Math.max(1, parseFloat(val));
        txtTargetVal.innerText = targetDist;
        announcedMarks = {};
        updateDistUI();
        speak(targetDist + 'メートルにセットしました');
      }
    });

    function updateDistUI() {
      txtDist.innerText = totalDist.toFixed(2);
      var rem = targetDist - totalDist;
      txtRemain.innerText = rem.toFixed(2);
      txtRemain.style.color = (rem <= 0) ? '#ef4444' : '#38bdf8';
    }

    // カメラ・UI
    var tabClose = document.getElementById('tab-close');
    var tabWide = document.getElementById('tab-wide');
    tabClose.addEventListener('click', function() { scaleFactor = 2.5; tabClose.className = 'tab-btn active'; tabWide.className = 'tab-btn'; });
    tabWide.addEventListener('click', function() { scaleFactor = 1.4; tabWide.className = 'tab-btn active'; tabClose.className = 'tab-btn'; });

    document.getElementById('b-cam').addEventListener('click', function() {
      vBar.style.display = 'none';
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
        }).then(function(stream) {
          v.srcObject = stream;
          v.play();
          isPaused = false;
          bPause.innerText = '一時停止 ⏸';
          startLoop();
        }).catch(function(e) { alert("カメラ起動エラー: " + e.message); });
      }
    });

    document.getElementById('f-video').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      if (v.srcObject) { v.srcObject.getTracks().forEach(function(t) { t.stop(); }); v.srcObject = null; }
      v.src = URL.createObjectURL(file);
      vBar.style.display = 'flex';
      v.play();
      isPaused = false;
      bPause.innerText = '一時停止 ⏸';
      startLoop();
    });

    var vbPlay = document.getElementById('vb-play');
    vbPlay.addEventListener('click', function() {
      if (v.paused) { v.play(); vbPlay.innerText = '一時停止 ⏸'; }
      else { v.pause(); vbPlay.innerText = '再生 ▶'; }
    });
    document.getElementById('vb-b1').addEventListener('click', function() { v.currentTime = Math.max(0, v.currentTime - 1); });
    document.getElementById('vb-f1').addEventListener('click', function() { v.currentTime = Math.min(v.duration || 999, v.currentTime + 1); });
    document.getElementById('vb-bstep').addEventListener('click', function() { v.pause(); vbPlay.innerText = '再生 ▶'; v.currentTime = Math.max(0, v.currentTime - 0.033); });
    document.getElementById('vb-fstep').addEventListener('click', function() { v.pause(); vbPlay.innerText = '再生 ▶'; v.currentTime = Math.min(v.duration || 999, v.currentTime + 0.033); });
    v.addEventListener('timeupdate', function() {
      if (v.duration) vTime.innerText = v.currentTime.toFixed(1) + 's / ' + v.duration.toFixed(1) + 's';
    });

    document.getElementById('b-p01').addEventListener('click', function() { totalDist += 0.1; updateDistUI(); checkDistanceAnnouncements(totalDist); });
    document.getElementById('b-m01').addEventListener('click', function() { totalDist = Math.max(0, totalDist - 0.1); updateDistUI(); });
    document.getElementById('b-zero').addEventListener('click', function() {
      totalDist = 0.0;
      announcedMarks = {};
      speedSamples = [];
      updateDistUI();
      txtSpeed.innerText = "0.0";
    });

    bPause.addEventListener('click', function() {
      isPaused = !isPaused;
      if (isPaused) {
        bPause.className = 'green';
        bPause.innerText = '測定再開 ▶';
        txtSpeed.innerText = "0.0";
      } else {
        bPause.className = 'orange';
        bPause.innerText = '一時停止 ⏸';
        prevProfile = null;
      }
    });

    function startLoop() {
      if (isRunning) return;
      isRunning = true;
      requestAnimationFrame(mainLoop);
    }

    function mainLoop(now) {
      var stage = document.getElementById('stage');
      var sw = stage.clientWidth;
      var sh = stage.clientHeight;

      if (overlay.width !== sw || overlay.height !== sh) {
        overlay.width = sw;
        overlay.height = sh;
      }

      var bw = Math.floor(sw * 0.92);
      var bh = 150;
      var bx = Math.floor((sw - bw) / 2);
      var by = Math.floor(sh * 0.50 - bh / 2);

      ctxOverlay.clearRect(0, 0, sw, sh);
      ctxOverlay.strokeStyle = isPaused ? '#94a3b8' : '#22c55e';
      ctxOverlay.lineWidth = 2;
      ctxOverlay.strokeRect(bx, by, bw, bh);

      var cLen = 14;
      ctxOverlay.lineWidth = 3;
      ctxOverlay.beginPath(); ctxOverlay.moveTo(bx, by + cLen); ctxOverlay.lineTo(bx, by); ctxOverlay.lineTo(bx + cLen, by); ctxOverlay.stroke();
      ctxOverlay.beginPath(); ctxOverlay.moveTo(bx + bw - cLen, by); ctxOverlay.lineTo(bx + bw); ctxOverlay.lineTo(bx + bw, by + cLen); ctxOverlay.stroke();
      ctxOverlay.beginPath(); ctxOverlay.moveTo(bx, by + bh - cLen); ctxOverlay.lineTo(bx, by); ctxOverlay.lineTo(bx + cLen, by + bh); ctxOverlay.stroke();
      ctxOverlay.beginPath(); ctxOverlay.moveTo(bx + bw - cLen, by + bh); ctxOverlay.lineTo(bx + bw, by + bh); ctxOverlay.lineTo(bx + bw, by + bh - cLen); ctxOverlay.stroke();

      ctxOverlay.fillStyle = isPaused ? '#94a3b8' : '#22c55e';
      ctxOverlay.font = '12px sans-serif';
      ctxOverlay.fillText(isPaused ? '⏸ 測定停止中' : '🎯 ケーブル測定枠', bx, by - 8);

      if (v.readyState >= 2 && v.videoWidth > 0) {
        var pw = 160;
        var ph = 40;
        if (cProc.width !== pw || cProc.height !== ph) { cProc.width = pw; cProc.height = ph; }

        var vw = v.videoWidth;
        var vh = v.videoHeight;
        var scale = Math.max(sw / vw, sh / vh);
        var rw = vw * scale;
        var rh = vh * scale;
        var ox = (sw - rw) / 2;
        var oy = (sh - rh) / 2;

        var sx = Math.max(0, (bx - ox) / scale);
        var sy = Math.max(0, (by - oy) / scale);
        var swSrc = Math.min(vw - sx, bw / scale);
        var shSrc = Math.min(vh - sy, bh / scale);

        ctxProc.drawImage(v, sx, sy, swSrc, shSrc, 0, 0, pw, ph);
        var imgData = ctxProc.getImageData(0, 0, pw, ph).data;

        var curProf = new Float32Array(pw);
        for (var x = 0; x < pw; x++) {
          var sum = 0, cnt = 0;
          for (var y = 0; y < ph; y++) {
            var idx = (y * pw + x) * 4;
            var g = 0.299 * imgData[idx] + 0.587 * imgData[idx+1] + 0.114 * imgData[idx+2];
            if (g < 235) { sum += g; cnt++; }
          }
          curProf[x] = cnt > 0 ? sum / cnt : 0;
        }

        if (!isPaused && prevProfile) {
          var maxS = 14, bestS = 0, minDiff = 999999;
          for (var s = -maxS; s <= maxS; s++) {
            var diff = 0;
            for (var i = maxS; i < pw - maxS; i++) {
              diff += Math.abs(prevProfile[i] - curProf[i + s]);
            }
            if (diff < minDiff) { minDiff = diff; bestS = s; }
          }

          var shiftPx = bestS * (swSrc / pw);
          var deltaM = (shiftPx / scaleFactor) / 1000.0;
          var dt = (now - lastLoopTime) / 1000.0;

          if (Math.abs(deltaM) < 0.05 && Math.abs(deltaM) > 0.0006) {
            totalDist += deltaM;
            updateDistUI();
            checkDistanceAnnouncements(totalDist);

            if (dt > 0 && dt < 0.25) {
              speedSamples.push(Math.max(0, (deltaM / dt) * 60.0));
            }
          } else {
            speedSamples.push(0);
          }

          if (now - lastSpeedTime > 500) {
            if (speedSamples.length > 0) {
              var avg = speedSamples.reduce(function(a, b) { return a + b; }, 0) / speedSamples.length;
              currentSpeed = currentSpeed * 0.3 + avg * 0.7;
              speedSamples = [];
            } else {
              currentSpeed = 0.0;
            }
            txtSpeed.innerText = Math.max(0, currentSpeed).toFixed(1);
            lastSpeedTime = now;
          }
        }
        prevProfile = curProf;
      }

      lastLoopTime = now;
      requestAnimationFrame(mainLoop);
    }
  </script>
</body>
