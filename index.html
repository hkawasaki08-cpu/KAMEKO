<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO Next</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100dvh;
      background: #09090b; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }
    header {
      background: #18181b; padding: 4px 10px; height: 32px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #27272a; flex-shrink: 0; z-index: 30;
    }
    .title { font-size: 12px; font-weight: bold; color: #4ade80; }
    #status-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: #475569; color: #fff; font-weight: bold;
    }
    #status-badge.active { background: #16a34a; }

    #dash-container {
      background: #111827; padding: 6px 6px;
      border-bottom: 1px solid #1f2937; flex-shrink: 0; z-index: 25;
    }
    #dash { display: flex; gap: 4px; }
    .card {
      flex: 1; background: #000; border: 1px solid #374151; border-radius: 6px;
      padding: 10px 4px; text-align: center; min-height: 84px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .card-lbl { font-size: 11px; color: #9ca3af; font-weight: bold; margin-bottom: 2px; }
    .card-val { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .card-unit { font-size: 11px; color: #9ca3af; margin-left: 2px; }
    .card-sub { font-size: 9px; color: #38bdf8; font-weight: bold; margin-top: 3px; }

    #control-subbar {
      background: #18181b; padding: 3px 6px; display: flex; gap: 6px;
      align-items: stretch; border-bottom: 1px solid #27272a; flex-shrink: 0;
    }
    .mode-tab {
      flex: 1; background: #1e293b; border: 1px solid #475569; color: #94a3b8;
      padding: 0; border-radius: 4px; font-size: 11px; font-weight: 900;
      cursor: pointer; text-align: center; height: 17px; min-height: 17px; line-height: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .mode-tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    #btn-dir {
      flex: 0 0 54px; font-size: 12px; font-weight: 900; border-radius: 4px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      height: 17px; min-height: 17px; line-height: 15px; padding: 0;
    }
    #btn-dir.dir-fwd { background: #0d9488; border: 1.5px solid #2dd4bf; color: #fff; }
    #btn-dir.dir-rev { background: #ea580c; border: 1.5px solid #fb923c; color: #fff; }

    #stage {
      position: relative; flex: 1; min-height: 75px; max-height: 155px; width: 100%;
      background: #000; overflow: hidden; border-bottom: 1px solid #334155;
    }
    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center center; background: #000;
      transform-origin: center center;
    }
    #target-box {
      position: absolute; top: 10%; left: 3%; width: 94%; height: 80%;
      border: 2px solid #22c55e; border-radius: 6px;
      box-shadow: inset 0 0 8px rgba(34, 197, 94, 0.4);
      z-index: 10; pointer-events: none;
    }
    #target-center-line {
      position: absolute; top: 0; left: 50%; width: 1px; height: 100%;
      border-left: 1px dashed rgba(255, 255, 255, 0.6); pointer-events: none;
    }

    #diag-panel {
      background: #0b1329; border-bottom: 1px solid #1e293b;
      padding: 3px 6px; display: flex; gap: 6px; align-items: center; flex-shrink: 0;
    }
    #diag-info { flex: 1; display: flex; flex-direction: column; gap: 1px; }
    #diag-msg { font-size: 10px; font-weight: bold; color: #4ade80; }
    #diag-sub { font-size: 8px; color: #94a3b8; font-variant-numeric: tabular-nums; }

    #rec-controls-bar {
      background: #18181b; padding: 4px 6px; display: flex; gap: 6px;
      align-items: center; justify-content: flex-end; border-bottom: 1px solid #27272a; flex-shrink: 0;
    }
    #b-reload {
      background: #334155; color: #fff; border: 1.5px solid #475569;
      padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: bold;
      cursor: pointer; height: 34px; min-height: 34px;
      display: flex; align-items: center; justify-content: center;
    }

    #v-bar {
      background: #0f172a; border-bottom: 1px solid #1e293b;
      padding: 3px 6px; display: none; flex-direction: column; gap: 4px; flex-shrink: 0;
    }
    .v-row { display: flex; gap: 5px; align-items: center; }

    .align-slider-row {
      display: flex; gap: 6px; align-items: center; background: #1e293b;
      padding: 3px 6px; border-radius: 4px; font-size: 10px; color: #38bdf8; font-weight: bold;
    }
    .align-slider-row select {
      background: #0f172a; color: #4ade80; border: 1px solid #0284c7;
      border-radius: 4px; font-size: 10px; font-weight: 900; padding: 2px 4px; cursor: pointer;
    }
    .align-slider-row input[type="range"] {
      flex: 1; height: 5px; accent-color: #38bdf8; cursor: pointer;
    }
    
    .v-btn {
      flex: 1; background: #1e293b; color: #fff; border: 1px solid #475569;
      padding: 0; border-radius: 4px; font-size: 10px; font-weight: bold;
      text-align: center; cursor: pointer; line-height: 15px; height: 17px; min-height: 17px;
      display: flex; align-items: center; justify-content: center;
    }
    #b-test-cal { background: #0369a1; border-color: #38bdf8; color: #fff; }
    #b-test-cal.calibrating { background: #dc2626 !important; border-color: #f87171 !important; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.6; } }

    .spd-step-btn {
      flex: 0 0 58px; background: #1e293b; color: #38bdf8;
      border: 1.5px solid #0284c7; border-radius: 6px; font-size: 12px; font-weight: 900;
      cursor: pointer; text-align: center; line-height: 1; height: 34px; min-height: 34px;
      display: flex; align-items: center; justify-content: center;
    }
    #txt-spd-val {
      flex: 1; background: #000; color: #4ade80; border: 1.5px solid #334155;
      border-radius: 6px; font-size: 13px; font-weight: 900; text-align: center;
      cursor: pointer; font-variant-numeric: tabular-nums; line-height: 1; height: 34px; min-height: 34px;
      display: flex; align-items: center; justify-content: center;
    }

    footer {
      background: #18181b; padding: 4px 6px calc(6px + env(safe-area-inset-bottom, 2px));
      display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #27272a; flex-shrink: 0; z-index: 40;
    }
    .btn-row-top, .btn-row-bottom { display: flex; gap: 5px; align-items: stretch; }
    button, label.btn {
      background: #27272a; color: #fff; border: 1.5px solid #3f3f46; border-radius: 6px;
      font-size: 12px; font-weight: bold; text-align: center; cursor: pointer; touch-action: manipulation;
      display: flex; justify-content: center; align-items: center; min-height: 58px; padding: 0 4px;
    }
    button.green { background: #16a34a; border-color: #22c55e; }
    button.orange { background: #d97706; border-color: #f59e0b; }
    button.purple { background: #7c3aed; border-color: #a855f7; }
    input[type="file"] { display: none; }
    .col-left-main { flex: 1.3 !important; min-height: 58px; }
    .col-center-wide { flex: 1.6 !important; min-height: 58px; }
    .col-right-fixed { flex: 0 0 68px !important; min-height: 58px; padding: 0 !important; }
    #b-pause { font-size: 15px; font-weight: 900; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.4); }
    #b-zero { font-size: 14px; font-weight: 900; color: #f87171; }
    #b-manual-start { font-size: 13px; font-weight: 900; line-height: 1.3; }
    #b-set-target { font-size: 16px; font-weight: 900; letter-spacing: 0.5px; }
  </style>
</head>

  <!-- ========================================== -->
  <!-- Web Worker: ルーカス・カナデ法 ＋ カルマンフィルタ -->
  <!-- ========================================== -->
  <script id="worker-script" type="text/worker">
    var ROI_W = 320, ROI_H = 64;
    var prevGray = new Uint8Array(ROI_W * ROI_H);
    var currGray = new Uint8Array(ROI_W * ROI_H);
    var hasPrev = false;

    // 特徴点プール（ゼロアロケーション）
    var MAX_PTS = 50;
    var ptX = new Float32Array(MAX_PTS);
    var ptY = new Float32Array(MAX_PTS);
    var numPts = 0;

    // カルマンフィルタ状態 [位置(px), 速度(px/s)]
    var kf_x = 0.0, kf_v = 0.0;
    var kf_p00 = 1.0, kf_p01 = 0.0, kf_p10 = 0.0, kf_p11 = 1.0;
    var Q_pos = 0.1, Q_vel = 5.0; // プロセスノイズ
    var R_base = 2.0;             // 観測ノイズ基底

    var totalAccumPx = 0.0;
    var scaleFactor = 2.675;      // px/mm
    var moveDir = 1;              // 1: 左流(⬅正), -1: 右流
    var isTracking = false;
    var lastTs = 0;

    // CLAHE調 局所輝度正規化
    function preprocessGray(rgbaData) {
      var minV = 255, maxV = 0;
      for (var i = 0, j = 0; i < rgbaData.length; i += 4, j++) {
        var g = (0.299 * rgbaData[i] + 0.587 * rgbaData[i+1] + 0.114 * rgbaData[i+2]) | 0;
        currGray[j] = g;
        if (g < minV) minV = g;
        if (g > maxV) maxV = g;
      }
      var range = maxV - minV;
      if (range > 10) {
        var mult = 255.0 / range;
        for (var j = 0; j < currGray.length; j++) {
          currGray[j] = Math.min(255, ((currGray[j] - minV) * mult) | 0);
        }
      }
    }

    // Shi-Tomasi調 高信頼度特徴点リシード
    function reseedFeatures() {
      numPts = 0;
      var stepX = 16, stepY = 12;
      for (var y = 10; y < ROI_H - 10 && numPts < MAX_PTS; y += stepY) {
        for (var x = 12; x < ROI_W - 12 && numPts < MAX_PTS; x += stepX) {
          // 水平勾配強度チェック
          var idx = y * ROI_W + x;
          var dx = Math.abs(currGray[idx + 1] - currGray[idx - 1]);
          if (dx > 12) {
            ptX[numPts] = x;
            ptY[numPts] = y;
            numPts++;
          }
        }
      }
    }

    // ピラミッド型1Dルーカス・カナデ オプティカルフロー
    function calcOpticalFlowLK() {
      if (numPts < 8) reseedFeatures();
      if (numPts === 0) return 0.0;

      var shifts = [];
      var winR = 5;

      for (var p = 0; p < numPts; p++) {
        var cx = Math.round(ptX[p]), cy = Math.round(ptY[p]);
        if (cx < winR + 15 || cx >= ROI_W - winR - 15) continue;

        var bestShift = 0, minSAD = 999999;
        // 水平方向限定探索（-15〜+15px）
        for (var s = -15; s <= 15; s++) {
          var sad = 0;
          for (var wy = -winR; wy <= winR; wy += 2) {
            var rowP = (cy + wy) * ROI_W;
            var rowC = rowP;
            for (var wx = -winR; wx <= winR; wx += 2) {
              sad += Math.abs(prevGray[rowP + (cx + wx)] - currGray[rowC + (cx + wx + s)]);
            }
          }
          if (sad < minSAD) { minSAD = sad; bestShift = s; }
        }

        shifts.push(bestShift);
        ptX[p] += bestShift; // 追跡点更新
      }

      if (shifts.length === 0) return 0.0;
      shifts.sort(function(a, b){ return a - b; });
      return shifts[Math.floor(shifts.length / 2)]; // 中央値
    }

    // カルマンフィルタ更新
    function updateKalman(measuredShiftPx, dtSec) {
      if (dtSec <= 0 || dtSec > 0.2) dtSec = 0.033;

      // 予測ステップ
      kf_x += kf_v * dtSec;
      kf_p00 += dtSec * (kf_p10 + kf_p01) + dtSec * dtSec * kf_p11 + Q_pos;
      kf_p01 += dtSec * kf_p11;
      kf_p10 += dtSec * kf_p11;
      kf_p11 += Q_vel;

      // 観測ステップ (速度 z = shift / dt)
      var z_vel = (measuredShiftPx / dtSec);
      var R_adaptive = R_base * (numPts < 15 ? 10.0 : 1.0); // 特徴点減少時は観測を軽視

      var S = kf_p11 + R_adaptive;
      var K0 = kf_p01 / S;
      var K1 = kf_p11 / S;

      var y_res = z_vel - kf_v;
      kf_x += K0 * y_res;
      kf_v += K1 * y_res;

      kf_p00 -= K0 * kf_p01;
      kf_p01 -= K0 * kf_p11;
      kf_p11 -= K1 * kf_p11;

      return measuredShiftPx;
    }

    self.onmessage = function(e) {
      var msg = e.data;
      if (msg.cmd === 'PROCESS') {
        var now = msg.ts;
        var dtSec = (lastTs > 0) ? (now - lastTs) / 1000.0 : 0.033;
        lastTs = now;

        var rgbaData = new Uint8ClampedArray(msg.buffer);
        preprocessGray(rgbaData);

        if (isTracking && hasPrev) {
          var rawShift = calcOpticalFlowLK();
          var shiftPx = rawShift * moveDir;
          updateKalman(shiftPx, dtSec);

          if (Math.abs(shiftPx) > 0.001) {
            totalAccumPx += shiftPx;
          }

          var distM = (totalAccumPx / scaleFactor) / 1000.0;
          var speedMMin = (Math.abs(kf_v) / scaleFactor) * 0.06; // px/s -> m/min

          self.postMessage({
            type: 'UPDATE',
            distM: distM,
            totalPx: totalAccumPx,
            speedMMin: speedMMin,
            pts: numPts,
            ts: now
          });
        }

        prevGray.set(currGray);
        hasPrev = true;

      } else if (msg.cmd === 'START') {
        isTracking = true;
        totalAccumPx = 0.0;
        kf_x = 0.0; kf_v = 0.0;
        reseedFeatures();
      } else if (msg.cmd === 'PAUSE') {
        isTracking = false;
      } else if (msg.cmd === 'RESET') {
        totalAccumPx = 0.0;
        kf_x = 0.0; kf_v = 0.0;
        reseedFeatures();
      } else if (msg.cmd === 'SET_SCALE') {
        scaleFactor = msg.scale;
      } else if (msg.cmd === 'SET_DIR') {
        moveDir = msg.dir;
      }
    };
  </script>

  <!-- ========================================== -->
  <!-- メインスレッド（UI制御・カメラキャプチャ） -->
  <!-- ========================================== -->
  <script>
    var operationMode = 'MANUAL';
    var nominalCableDiaMm = 89.0;
    var scaleFactor = 2.675;
    var moveDirection = 1;

    var totalDist = 0.0;
    var targetDist = 31.0;
    var isPaused = true;
    var isFileVideoMode = false;
    var currentPlaybackRate = 1.0;

    var videoAlignY = 0.90;
    var videoZoomScale = 1.0;
    var lastProcessTime = 0;
    var curCableThickPx = 16.0;

    var testCalActive = false;
    var testCalStartPx = 0.0;
    var totalPxFromWorker = 0.0;

    // インライン Worker 起動
    var workerBlob = new Blob([document.getElementById('worker-script').textContent], { type: 'application/javascript' });
    var worker = new Worker(URL.createObjectURL(workerBlob));

    var stage = document.getElementById('stage');
    var targetBox = document.getElementById('target-box');
    var v = document.getElementById('v');
    var cCap = document.getElementById('c-capture');
    var ctxCap = cCap.getContext('2d', { willReadFrequently: true, alpha: false });

    var txtDist = document.getElementById('txt-dist');
    var txtRemain = document.getElementById('txt-remain');
    var txtTargetVal = document.getElementById('txt-target-val');
    var txtSpeed = document.getElementById('txt-speed');
    var txtEta = document.getElementById('txt-eta');
    var statusBadge = document.getElementById('status-badge');
    var bPause = document.getElementById('b-pause');
    var bManualStart = document.getElementById('b-manual-start');
    var btnDir = document.getElementById('btn-dir');
    var bTestCal = document.getElementById('b-test-cal');
    var selCvtSize = document.getElementById('sel-cvt-size');
    var slVideoY = document.getElementById('sl-video-y');
    var slVideoZoom = document.getElementById('sl-video-zoom');
    var diagMsg = document.getElementById('diag-msg');
    var diagSub = document.getElementById('diag-sub');
    var vBar = document.getElementById('v-bar');
    var vbPlay = document.getElementById('vb-play');

    // Workerからの100ms周期軽量データ受信
    worker.onmessage = function(e) {
      var d = e.data;
      if (d.type === 'UPDATE') {
        totalDist = d.distM;
        totalPxFromWorker = d.totalPx;
        updateDistUI(d.speedMMin);
        diagSub.innerText = "追跡点: " + d.pts + " | スケール: " + scaleFactor.toFixed(3) + " px/mm";
      }
    };

    function updateDistUI(speed) {
      txtDist.innerText = Math.max(0, totalDist).toFixed(2);
      var rem = targetDist - totalDist;
      if (rem < 0) {
        txtRemain.innerText = '+' + Math.abs(rem).toFixed(2);
        txtRemain.style.color = '#ef4444';
        txtEta.innerText = "予想: 到達済";
      } else {
        txtRemain.innerText = rem.toFixed(2);
        txtRemain.style.color = '#38bdf8';
        if (speed >= 0.5) {
          var secTotal = Math.round((rem / speed) * 60.0);
          txtEta.innerText = "予想: " + Math.floor(secTotal / 60) + "分" + ((secTotal % 60 < 10) ? "0" : "") + (secTotal % 60) + "秒";
        } else {
          txtEta.innerText = "予想: --分--秒";
        }
      }
      txtSpeed.innerText = (speed || 0.0).toFixed(1);
    }

    function applyVideoTransform() {
      if (isFileVideoMode) {
        v.style.objectFit = 'cover';
        v.style.objectPosition = 'center ' + (videoAlignY * 100).toFixed(1) + '%';
        v.style.transform = 'scale(' + videoZoomScale.toFixed(2) + ')';
      } else {
        v.style.objectFit = 'cover';
        v.style.objectPosition = 'center center';
        v.style.transform = 'none';
      }
    }

    slVideoY.addEventListener('input', function() {
      videoAlignY = parseFloat(this.value) / 100.0;
      applyVideoTransform();
    });
    slVideoZoom.addEventListener('input', function() {
      videoZoomScale = parseFloat(this.value) / 100.0;
      applyVideoTransform();
    });

    selCvtSize.addEventListener('change', function() {
      nominalCableDiaMm = parseFloat(this.value);
      updateScaleFromNominal();
    });

    function updateScaleFromNominal() {
      var sw = targetBox.offsetWidth || 320;
      var est = (curCableThickPx / nominalCableDiaMm) * (sw / 320.0);
      if (est > 0.8 && est < 6.0) {
        scaleFactor = est;
        worker.postMessage({ cmd: 'SET_SCALE', scale: scaleFactor });
      }
    }

    btnDir.addEventListener('click', function() {
      moveDirection = (moveDirection === 1) ? -1 : 1;
      setDirection(moveDirection);
    });

    function setDirection(dir) {
      moveDirection = dir;
      if (moveDirection === 1) {
        btnDir.innerText = '⬅'; btnDir.className = 'dir-rev';
      } else {
        btnDir.innerText = '➡'; btnDir.className = 'dir-fwd';
      }
      worker.postMessage({ cmd: 'SET_DIR', dir: moveDirection });
    }

    bManualStart.addEventListener('click', function() {
      totalDist = 0.0;
      statusBadge.className = 'active'; statusBadge.innerText = '手動測定中';
      worker.postMessage({ cmd: 'START' });
      setPauseState(false);
    });

    function setPauseState(paused) {
      isPaused = paused;
      if (isPaused) {
        bPause.className = 'green col-left-main'; bPause.innerText = '測定開始 ▶';
        vbPlay.innerText = '再生 ▶';
        worker.postMessage({ cmd: 'PAUSE' });
        if (!v.paused) v.pause();
      } else {
        bPause.className = 'orange col-left-main'; bPause.innerText = '一時停止 ⏸';
        vbPlay.innerText = '一時停止 ⏸';
        worker.postMessage({ cmd: 'START' });
        if (v.paused) v.play().catch(function(){});
      }
    }

    bPause.addEventListener('click', function() {
      setPauseState(!isPaused);
    });

    document.getElementById('b-zero').addEventListener('click', function() {
      totalDist = 0.0;
      updateDistUI(0.0);
      worker.postMessage({ cmd: 'RESET' });
    });

    document.getElementById('b-set-target').addEventListener('click', function() {
      var val = window.prompt("目標距離(m):", targetDist);
      if (val !== null && !isNaN(parseFloat(val))) {
        targetDist = Math.max(1, parseFloat(val));
        txtTargetVal.innerText = targetDist;
        updateDistUI(0.0);
      }
    });

    // 精密検定オプション（2m校正/検証）
    bTestCal.addEventListener('click', function() {
      if (!testCalActive) {
        testCalActive = true;
        testCalStartPx = totalPxFromWorker;
        bTestCal.classList.add('calibrating');
        bTestCal.innerText = '⏹ 2枚目で確定';
      } else {
        testCalActive = false;
        bTestCal.classList.remove('calibrating');
        bTestCal.innerText = '📐 2m校正/検証';

        var diffPx = Math.abs(totalPxFromWorker - testCalStartPx);
        var curM = (diffPx / scaleFactor) / 1000.0;
        var opt = diffPx / 2000.0;
        var err = ((curM - 2.0) / 2.0) * 100.0;

        if (confirm("【精密検定 2m区間結果】\n実測誤差: " + (err>=0?"+":"") + err.toFixed(1) + "%\n最適スケール: " + opt.toFixed(4) + "\n適用しますか？")) {
          scaleFactor = opt;
          worker.postMessage({ cmd: 'SET_SCALE', scale: scaleFactor });
        }
      }
    });

    document.getElementById('b-reload').addEventListener('click', function() {
      if (confirm('再読み込みしますか？')) location.reload();
    });

    document.getElementById('f-video').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      isFileVideoMode = true;
      v.src = URL.createObjectURL(file);
      vBar.style.display = 'flex';
      v.currentTime = 0;
      v.pause();
      setPauseState(true);
      applyVideoTransform();
      diagMsg.innerText = "🎬 動画読み込み完了";
    });

    // メイン描画・Worker転送ループ（約30fps）
    function captureLoop(now) {
      if (now - lastProcessTime > 32) {
        lastProcessTime = now;

        if (v.readyState >= 2 && v.videoWidth > 0 && !v.paused) {
          var vw = v.videoWidth, vh = v.videoHeight;
          var sRect = stage.getBoundingClientRect();
          var bRect = targetBox.getBoundingClientRect();

          var scale = isFileVideoMode ? (Math.max(sRect.width / vw, sRect.height / vh) * videoZoomScale) : Math.max(sRect.width / vw, sRect.height / vh);
          var rw = vw * scale, rh = vh * scale;
          var ox = (sRect.width - rw) * 0.5;
          var oy = isFileVideoMode ? (sRect.height - rh) * videoAlignY : (sRect.height - rh) * 0.5;

          var sx = Math.max(0, Math.floor((bRect.left - sRect.left - ox) / scale));
          var sy = Math.max(0, Math.floor((bRect.top - sRect.top - oy) / scale));
          var sw = Math.min(vw - sx, Math.floor(bRect.width / scale));
          var sh = Math.min(vh - sy, Math.floor(bRect.height / scale));

          if (sw > 0 && sh > 0) {
            ctxCap.drawImage(v, sx, sy, sw, sh, 0, 0, 320, 64);
            var imgData = ctxCap.getImageData(0, 0, 320, 64);
            // Transferable Objects によるゼロコピー所有権譲渡
            worker.postMessage({ cmd: 'PROCESS', buffer: imgData.data.buffer, ts: now }, [imgData.data.buffer]);
          }
        }
      }
      requestAnimationFrame(captureLoop);
    }

    function openCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, frameRate: { ideal: 30 } }
      }).then(function(stream) {
        v.srcObject = stream;
        v.play().catch(function(){});
        setPauseState(false);
        diagMsg.innerText = "🟢 カメラ稼働中 (30fps / Worker解析)";
      }).catch(function(e) {
        diagMsg.innerText = "❌ カメラエラー: " + e.name;
      });
    }

    window.addEventListener('DOMContentLoaded', function() {
      setDirection(1);
      worker.postMessage({ cmd: 'SET_SCALE', scale: scaleFactor });
      requestAnimationFrame(captureLoop);
      openCamera();
    });
  </script>
</body>
</html>
