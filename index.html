<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>(仮称)カメラ式ケーブル距離計 - KAMEKO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }
    header {
      background: #18181b; padding: 8px 12px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #333; flex-shrink: 0;
    }
    .title { font-size: 13px; font-weight: bold; color: #4ade80; }
    #fps { font-size: 11px; color: #aaa; }

    #stage {
      position: relative; flex: 1; width: 100%;
      background: #111; overflow: hidden;
    }
    video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    /* ケーブル通過帯（40%位置）にドンピシャ配置 */
    #target-box {
      position: absolute;
      top: 40%; left: 4%; width: 92%; height: 100px;
      border: 2px solid #22c55e; border-radius: 4px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
      z-index: 10; pointer-events: none;
      display: flex; padding: 4px;
    }
    .box-tag {
      font-size: 10px; color: #22c55e;
      background: rgba(0,0,0,0.6); padding: 2px 4px; border-radius: 2px;
    }

    /* ダッシュボード */
    #dash {
      position: absolute; top: 6px; left: 6px; right: 6px;
      z-index: 20; display: flex; gap: 6px;
    }
    .card {
      flex: 1; background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
      padding: 6px 2px; text-align: center;
    }
    .card-lbl { font-size: 9px; color: #aaa; }
    .card-val { font-size: 20px; font-weight: bold; }
    .card-unit { font-size: 10px; color: #888; }

    /* モード切替 */
    #scale-selector {
      position: absolute; top: 66px; left: 6px; right: 6px;
      display: flex; gap: 6px; z-index: 20;
    }
    .tab-btn {
      flex: 1; background: rgba(15, 23, 42, 0.9);
      border: 1px solid #475569; color: #94a3b8;
      padding: 6px 0; border-radius: 6px; font-size: 11px;
      cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: bold; }

    /* 動画コントローラー */

      position: absolute; bottom: 6px; left: 6px; right: 6px;
      background: rgba(15, 23, 42, 0.95); border: 1px solid #38bdf8;
      border-radius: 6px; padding: 6px; z-index: 25;
      display: none; flex-direction: column; gap: 4px;
    }
